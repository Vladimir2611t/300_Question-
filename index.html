<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<title>Терапия: тренажёр</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16201e;--mut:#66726f;--line:#e0e6e4;--acc:#0f766e;--acc2:#e1f1ee;--onacc:#fff;--ok:#15803d;--oks:#e5f5e9;--bad:#c2410c;--bads:#fdede4;--warn:#a16207;--warns:#fbf3d9;--new:#cbd5d2}
@media (prefers-color-scheme:dark){:root{--bg:#0e1413;--card:#172120;--ink:#e7eeec;--mut:#93a29f;--line:#28342f;--acc:#2dd4bf;--acc2:#12312d;--onacc:#03201c;--ok:#4ade80;--oks:#12301c;--bad:#fb923c;--bads:#3a1e11;--warn:#facc15;--warns:#322a0e;--new:#33423e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:620px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:8px 0 2px;letter-spacing:-.01em}
h2{font-size:18px;margin:4px 0 12px}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.hero{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:22px}
.ring b small{font-size:11px;font-weight:400;color:var(--mut)}
.legend{font-size:14px;line-height:1.9}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
.btn{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;margin:0 0 10px}
.btn .ic{width:40px;height:40px;border-radius:12px;background:var(--acc2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.btn b{display:block;font-size:16.5px}
.btn small{display:block;color:var(--mut);font-size:13.5px;margin-top:1px}
.btn .bd{margin-left:auto;background:var(--bads);color:var(--bad);font-weight:700;font-size:13px;border-radius:20px;padding:3px 9px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.pri .ic{background:rgba(255,255,255,.18)}
.btn.pri small{color:inherit;opacity:.85}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{flex-direction:column;align-items:flex-start;margin:0}
.big{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:650;font-size:17px;background:var(--acc);color:var(--onacc);cursor:pointer;text-align:center}
.big.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px}.row>*{flex:1}
.top{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.x{border:0;background:none;color:var(--mut);font-size:15px;padding:6px 2px;cursor:pointer}
.prog{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.cnt{font-size:13px;color:var(--mut);min-width:46px;text-align:right}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--acc2);color:var(--acc)}
.tag.w{background:var(--warns);color:var(--warn)}.tag.b{background:var(--bads);color:var(--bad)}
.q{font-size:18px;font-weight:600;margin:0 0 6px;line-height:1.4}
.hint{color:var(--mut);font-size:13.5px;margin-bottom:12px}
.opt{display:flex;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;font-size:16px;line-height:1.35}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.ok{border-color:var(--ok);background:var(--oks)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bads)}.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{border-radius:14px;padding:13px 14px;margin-top:6px;font-size:15px}
.fb.ok{background:var(--oks)}.fb.bad{background:var(--bads)}
.fb h4{margin:0 0 4px;font-size:16px}
.fb .nt{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--warn);font-size:14px}
.foot{position:sticky;bottom:0;padding:10px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.tools{display:flex;gap:14px;justify-content:center;margin-top:4px}
.tools button{border:0;background:none;color:var(--mut);font-size:14px;padding:6px;cursor:pointer}
.tools .on{color:var(--warn)}
.combo{text-align:center;font-size:14px;color:var(--warn);min-height:20px}
.tp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.tp:last-child{border-bottom:0}
.tp .nm{flex:1;min-width:0}
.tp .nm b{display:block;font-size:15px;font-weight:600}
.tp .nm small{color:var(--mut);font-size:12.5px}
.bar{height:8px;border-radius:5px;background:var(--new);overflow:hidden;display:flex;margin-top:5px}
.bar i{display:block;height:100%}
.pc{font-weight:700;font-size:15px;min-width:44px;text-align:right}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;cursor:pointer;font-size:14px}
.seg .on{background:var(--card);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 12px;font-size:14px;cursor:pointer}
.chips .on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
input[type=search]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.li{border-bottom:1px solid var(--line);padding:12px 0}
.li:last-child{border-bottom:0}
.li .lq{font-weight:600;font-size:15px;cursor:pointer}
.li .la{margin-top:6px;font-size:14.5px}
.li .la .r{color:var(--ok);font-weight:600}
.li .la .ex{color:var(--mut);margin-top:4px}
.li .la .nt{color:var(--warn);margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
.chart i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--acc);min-height:2px}
.chart i.e{background:var(--line)}
.chart span{font-size:10px;color:var(--mut);margin-top:3px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv b{display:block;font-size:22px}.kv span{font-size:12px;color:var(--mut)}
.note{background:var(--warns);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0}
.res{text-align:center;padding:10px 0}
.res .n{font-size:46px;font-weight:800;line-height:1.1}
.lnk{border:0;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:6px 0;font-size:15px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.muted{color:var(--mut);font-size:13.5px}
.center{text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
