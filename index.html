<script>
var Q=[{"id":"b14c4f64","q":"\"Вторичная\" фибрилляция желудочков это:","o":["фибрилляция желудочков у больных с острым инфарктом миокарда без выраженных нарушений функции миокарда и других жизненно важных органов","фибрилляция желудочков у больных с тяжелыми нарушениями сократительной функции миокарда","ятрогенная фибрилляция желудочков","фибрилляция желудочков у больных с тяжелыми нарушениями сократительной функции миокарда, ятрогенная фибрилляция желудочков"],"c":[3],"e":"Вторичная ФЖ развивается на фоне тяжёлой сердечной недостаточности, кардиогенного шока, а также как осложнение лечения (ятрогенная). Поэтому верен объединённый вариант. Прогноз хуже, чем при первичной.","t":"ekg"},{"id":"6e93815c","q":"\"Первичная\" фибрилляция желудочков это:","o":["фибрилляция желудочков у больных с острым инфарктом миокарда без выраженных нарушений функции миокарда и других жизненно важных органов","фибрилляция желудочков у больных с тяжелыми нарушениями сократительной функции миокарда","ятрогенная фибрилляция желудочков"],"c":[0],"e":"Первичная ФЖ возникает внезапно, «на ровном месте», чаще в первые часы ИМ, без СН и шока. При своевременной дефибрилляции прогноз хороший.","t":"ekg"},{"id":"e5dd7a35","q":"\"Ржавая\" мокрота характерна для пневмонии, вызванной","o":["пневмококком","атипичными возбудителями","стафилококком","палочкой Фридлендера","синегнойной палочкой"],"c":[0],"e":"«Ржавая» мокрота — классика крупозной (пневмококковой) пневмонии: в ней продукты распада эритроцитов (гемосидерин). У Фридлендера — «желе из смородины».","t":"pul"},{"id":"b3d2803e","q":"8-летний больной направлен для обследования военкоматом. Развивался нормально. Над основанием сердца наблюдается грубый систолический шум с эпицентром во 2-ом межреберье у правого края грудины, проводится на сонные артерии. Второй тон над аортой ослаблен. Пульс 64 в мин. Ритмичный. АД на плечевой артерии 95 и 75 мм.рт.ст. На бедренной артерии АД 110 и 90 мм.рт.ст. Ваш диагноз:","o":["стеноз устья аорты","сочетанный порок сердца","коарктация аорты","дефект межжелудочковой перегородки.","открытый аортальный проток."],"c":[0],"e":"Грубый систолический шум во 2-м межреберье справа с проведением на сонные артерии, ослабленный II тон над аортой, малое пульсовое давление (95/75) — стеноз устья аорты. АД на бедре выше, чем на плече, — это норма, поэтому коарктация исключается.","t":"ser"},{"id":"5e8b554c","q":"Fe в плазме связывается с:","o":["транскортином","трансферрином","гемосидерином","протопорфирином"],"c":[1],"e":"Трансферрин — транспортный белок железа в плазме. Ферритин и гемосидерин — формы хранения в тканях, транскортин переносит кортизол.","t":"hem"},{"id":"e0ff634b","q":"H-2-гистаминовые рецепторы блокирует:","o":["альмагель","димедрол","атропин","рабепразол","фамотидин"],"c":[4],"e":"Фамотидин — Н2-блокатор («-тидин»). Димедрол — Н1-блокатор, рабепразол — ИПП, альмагель — антацид, атропин — М-холиноблокатор.","t":"gas"},{"id":"5e7501fd","q":"На вдохе могут усиливаться:","o":["только систолические шумы","только диастолические шумы","как систолические, так и диастолические шумы","ни те, ни другие"],"c":[2],"e":"На вдохе растёт приток к правому сердцу — усиливаются правосторонние шумы (симптом Риверо-Корвалло): и систолический (трикуспидальная недостаточность), и диастолический (стеноз трикуспидального, недостаточность клапана ЛА).","t":"ser"},{"id":"0f6987bd","q":"На нарушение функции почек указывает повышение уровня креатинина начиная с:","o":["0,5 мг%","1,5 мг%","2 мг%","3 мг%","5 мг%"],"c":[1],"e":"Норма креатинина ~0,6–1,2 мг% (≈ 50–110 мкмоль/л). Уровень ≥1,5 мг% (~130 мкмоль/л) считают признаком нарушения функции почек.","t":"nef"},{"id":"6c199b76","q":"На нормальную кишечную флору не оказывает влияния:","o":["бисептол","креон","оксациллин","тетрациклин","метотрексат"],"c":[1],"e":"Креон — ферменты поджелудочной железы, на микробиоту не действует. Антибиотики, бисептол и цитостатик метотрексат флору нарушают.","t":"gas"},{"id":"aef91a11","q":"На ЭКГ при токсическом зобе редко констатируют:","o":["высокие зубцы R, P и T при легкой форме заболевания","укорочения интервала Р-Q при легкой форме","отрицательный зубец Т при тяжелой форме","двухфазный зубец T при тяжелой форме","отрицательный зубец Т при легкой форме"],"c":[4],"e":"При лёгком тиреотоксикозе зубцы, наоборот, высокие (симпатикотония). Отрицательный/двухфазный T появляется при тяжёлой форме (тиреотоксическая кардиомиопатия), а не при лёгкой.","t":"end"},{"id":"013f2e0c","q":"Назначать антиангинальные препараты больным ИБС с безболевыми эпизодами ишемии миокарда:","o":["не следует","следует","да, но только при наличии дополнительных показаний"],"c":[1],"e":"Безболевая ишемия так же опасна, как болевая (риск ИМ и внезапной смерти), поэтому её лечат так же.","t":"ibs"},{"id":"6b64ad11","q":"Назначение тиреоидных препаратов при нормальной функции щитовидной железы является","o":["нецелесообразным","целесообразным"],"c":[0],"e":"При эутиреозе гормоны щитовидной железы не нужны: они вызовут ятрогенный тиреотоксикоз. (Исключения — особые случаи, например после операции по поводу рака.)","t":"end"},{"id":"5b84f8b9","q":"Назовите гемодинамические последствия (косвенные признаки) митрального стеноза, определяемого с помощью ЭхоКГ:","o":["гипертрофия левого желудочка","дилатация левого желудочка","дилатация левого предсердия и гипертрофия правого желудочка"],"c":[2],"e":"При МС кровь «застревает» перед суженным клапаном: растягивается ЛП, растёт давление в малом круге, гипертрофируется ПЖ. ЛЖ при этом недогружен.","t":"ser"},{"id":"96871066","q":"Назовите одно из показаний к хирургическому лечению синдрома WPW:","o":["приступы мерцания-трепетания предсердий с частотой 1-2 раза в год","наличие хотя бы одного приступа документированной фибрилляции или трепетания желудочков","приступы пароксизмальной предсердной тахикардии, купируемые вагусными пробами"],"c":[1],"e":"Эпизод ФЖ/ТЖ при WPW — угроза внезапной смерти, нужна абляция дополнительного пути. Редкие или легко купируемые пароксизмы — не абсолютное показание.","t":"ekg"},{"id":"d9d9ca37","q":"Назовите основной источник поступления йода в организм человека","o":["вода","воздух","продукты питания"],"c":[2],"e":"Около 90% йода поступает с пищей (морепродукты, йодированная соль, молоко, яйца). Вода и воздух дают ничтожную долю.","t":"end"},{"id":"a7b65df8","q":"Назовите основной признак (критерий) клапанной регургитации по допплер-ЭхоКГ","o":["регистрация замедленного потока крови дистальнее клапана","регистрация ускоренного турбулентного ретроградного потока крови проксимальнее клапана","регистрация ускоренного турбулентного потока крови дистальнее"],"c":[1],"e":"Регургитация = кровь идёт обратно через закрытый клапан → ретроградный турбулентный поток ПЕРЕД клапаном (проксимальнее). Стеноз — ускоренный поток ЗА клапаном.","t":"ser"},{"id":"17b356ae","q":"Назовите основной признак (критерий) стеноза по допплер-ЭхоКГ","o":["регистрация ретроградного турбулентного потока крови","регистрация ускоренного турбулентного потока крови дистальнее"],"c":[1],"e":"При стенозе кровь протискивается через узкое отверстие → высокоскоростная турбулентная струя ЗА клапаном. Ретроградный поток — признак регургитации.","t":"ser"},{"id":"9d4baa73","q":"Назовите основной признак аневризмы сердца по ЭхоКГ","o":["наличие рубцовых изменений миокарда","наличие пристеночного тромба","диастолическая деформация полости левого желудочка"],"c":[2],"e":"Аневризма — выбухание истончённой стенки, деформирующее контур ЛЖ даже в диастолу (в отличие от простой акинезии). Рубец и тромб могут быть и без аневризмы.","t":"ser"},{"id":"ccc29e4d","q":"Назовите основной признак пролапса митрального клапана, определяемый при ЭхоКГ","o":["среднесистолическое прикрытие створок митрального клапана","переднесистолическое движение передней створки митрального клапана","провисание одной или обеих створок митрального клапана в систолу в левое предсердие","мелкоамплитудные диастолические осцилляции створок митрального клапана"],"c":[2],"e":"Пролапс = прогиб створок в ЛП во время систолы. Переднесистолическое движение — признак ГКМП, диастолические осцилляции — аортальной недостаточности.","t":"ser"},{"id":"77d2eeda","q":"Назовите основной функциональный метод, верифицирующий синдром пролабирования митрального клапана","o":["фонокардиография","электрокардиография","апекскардиография","эхокардиография","сфигмография"],"c":[3],"e":"ПМК — морфологическое изменение клапана, его видно только на ЭхоКГ.","t":"ser"},{"id":"90383285","q":"Назовите основную причину возникновения желудочковой пароксизмальной тахикардии","o":["миокардиты","кардиомиопатии","ревматические и врожденные пороки сердца","дигиталисная интоксикация","ИБС (острый инфаркт миокарда)"],"c":[4],"e":"Самая частая причина ЖТ — ИБС, особенно острый ИМ и постинфарктный рубец (субстрат для re-entry).","t":"ekg"},{"id":"5ff35733","q":"Назовите отведения в которых в норме не бывает зубца Q:","o":["V4-V6","I, II, II, aVR","V1-V3","aVL, aVF"],"c":[2],"e":"В V1–V3 в норме комплекс rS, Q отсутствует. Любой q в V1–V3 подозрителен на рубец/ИМ перегородки. В V4–V6 небольшой септальный q — норма.","t":"ekg"},{"id":"c7ded338","q":"Назовите отведения, в которых лучше видны волны фибрилляции предсердий( F):","o":["II, III, aVF, V1","I, aVL, V5-V6","V3-V5","aVR"],"c":[0],"e":"Волны f лучше видны в нижних отведениях (II, III, aVF) и в V1, которое расположено ближе всего к предсердиям.","t":"ekg"},{"id":"b37c0098","q":"Назовите ультразвуковой метод, с помощью которого возможна достоверная диагностика недостаточности митрального клапана:","o":["одномерная ЭхоКГ","двухмерная ЭхоКГ","допплер-ЭхоКГ","стресс-ЭхоКГ"],"c":[2],"e":"Регургитацию (обратный поток) напрямую видно только при допплере. М- и В-режимы дают лишь косвенные признаки.","t":"ser"},{"id":"dfed866c","q":"Наиболее ранний клинический признак гипертрофии правого желудочка:","o":["набухание шейных вен","гепатомегалия","тахикардия","эпигастральная пульсация","периферические отеки"],"c":[3],"e":"Гипертрофированный ПЖ даёт пульсацию в эпигастрии (сердечный толчок). Набухание вен, печень, отёки — признаки уже декомпенсации (правожелудочковой недостаточности).","t":"ser"},{"id":"5cacab6b","q":"Наиболее ранний признак билиарного цирроза печени:","o":["холестаз","портальная гипертензия","печеночная недостаточность","астенический синдром","диспепсический синдром"],"c":[0],"e":"Первичный билиарный холангит начинается с поражения мелких желчных протоков → холестаз задолго до цирроза. Портальная гипертензия и недостаточность — поздние.","t":"gas"},{"id":"2a378ab7","q":"Наиболее ранний признак билиарного цирроза печени:","o":["кровоточивость десен","гепатомегалия","снижение уровня холинэстеразы","кожный зуд","повышение уровня АСТ и АЛТ"],"c":[3],"e":"Кожный зуд — первое проявление холестаза (желчные кислоты в коже), часто за годы до желтухи.","t":"gas"},{"id":"e1f5ef4f","q":"Наиболее ранним проявлением рака пищевода является:","o":["похудание","боль за грудиной и в спине","дисфагия","срыгивание застойным содержимым","усиленное слюноотделение"],"c":[2],"e":"Первым симптомом обычно становится нарушение глотания (сначала твёрдой пищи). Боль, похудание, регургитация — позже.","t":"gas"},{"id":"da1cb928","q":"Наиболее раннюю диагностику рака желудка обеспечивает метод:","o":["рентгенографии желудка","гастроскопии","поиска \"малых признаков\"","обзорной рентгенографии желудка","гистологического исследования биоптата, полученного при хромогастроскопии"],"c":[4],"e":"Хромоэндоскопия выявляет мелкие очаги, а биопсия с гистологией подтверждает рак на самой ранней стадии. Простая гастроскопия без прицельной биопсии уступает.","t":"gas"},{"id":"19926d14","q":"Наиболее рациональная схема лечения аутоиммунного гепатита включает:","o":["глюкокортикоиды и липоевую кислоту","карсил и интерферон","глюкокортикоиды и азатиоприн","эссенциале и декарис","делагил и витамины группы В"],"c":[2],"e":"Стандарт — преднизолон (или будесонид) + азатиоприн. Интерферон при АИГ противопоказан: может обострить аутоиммунный процесс.","t":"gas"},{"id":"32c6e260","q":"Наиболее атерогенными по классификации Фридериксена считаются типы гиперлипопротеинемии","o":["I, II, III","I, III","II, III","IV, V"],"c":[2],"e":"Типы II (ЛПНП) и III (ЛППП/ремнанты) наиболее атерогенны. Тип I (хиломикроны) атеросклероза почти не вызывает — грозит панкреатитом.","t":"ibs","r":2},{"id":"af1bb440","q":"Наиболее вероятной причиной артериальной гипертонии у больного 50 лет со стенокардией напряжения III функционального класса и шумом, выслушиваемым в области проекции левой почечной артерии, является:","o":["фибромышечная дисплазия","неспецифический аортоартериит","гипоплазия почечной артерии","атеросклероз почечной артерии"],"c":[3],"e":"Мужчина 50 лет с ИБС = системный атеросклероз → атеросклеротический стеноз почечной артерии. Фибромышечная дисплазия — у молодых женщин.","t":"ag"},{"id":"60233e59","q":"Наиболее вероятной причиной артериальной гипертонии у больного с жаждой, полиурией, мышечной слабостью и удлинением интервала Q-T на ЭКГ, является:","o":["гипертоническая болезнь","хронический пиелонефрит","первичный гиперальдостеронизм (синдром Конна)","феохромоцитома"],"c":[2],"e":"Альдостерон выводит калий → гипокалиемия: мышечная слабость, полиурия/жажда (калиопеническая нефропатия), удлинение QT, U-волна.","t":"ag"},{"id":"83814a94","q":"Наиболее вероятной причиной артериальной гипертонии у больной 20 лет с шумом в области проекции правой почечной артерии, увеличенной СОЭ и лейкоцитозом, являются:","o":["фибромускулярная дисплазия","гломерулонефрит","неспецифический аортоартериит","стеноз почечной артерии","аневризма почечной артерии"],"c":[2],"e":"Молодая женщина + стеноз артерии + признаки воспаления (СОЭ, лейкоцитоз) = болезнь Такаясу. При фибромышечной дисплазии воспаления нет.","t":"ag"},{"id":"a18689ab","q":"Наиболее вероятной причиной возобновления приступов стенокардии в ближайшие сроки после выполнения операции аортокоронарного шунтирования является:","o":["прогрессирование коронарного атеросклероза","окончание \"плацебо-эффекта\" оперативного вмешательства","окклюзия шунтов"],"c":[2],"e":"Ранний возврат стенокардии — тромбоз/окклюзия шунта. Прогрессирование атеросклероза — причина поздних (через годы) рецидивов.","t":"ibs"},{"id":"749e66ef","q":"Наиболее вероятной причиной усиления атонии кишечника при остром инфаркте миокарда может быть введение:","o":["морфина","лидокаина","гепарина","нитроглицерина","норадреналина"],"c":[0],"e":"Опиаты угнетают перистальтику (запор, парез кишечника) и вызывают задержку мочи.","t":"ibs"},{"id":"7790df0b","q":"Наиболее высокой чувствительностью при диагностике ИБС обладает","o":["холодовая проба","дипиридамоловая проба","проба с физической нагрузкой на велоэргометре","проба со статической физической нагрузкой"],"c":[2],"e":"Из перечисленных самая чувствительная — динамическая нагрузочная проба (ВЭМ/тредмил).","t":"ibs"},{"id":"6598c35a","q":"Наиболее достоверным для диагностики вазоренальных гипертоний является:","o":["определение активности ренина в плазме крови","экскреторная урография","ультразвуковое исследование почечных артерий","контрастная ангиография","радионуклидная сцинтиграфия почек"],"c":[3],"e":"«Золотой стандарт» — ангиография почечных артерий: прямо показывает стеноз, его степень и локализацию.","t":"ag"},{"id":"8f9e7924","q":"Наиболее информативный инструментальный метод диагностики ТЭЛА:","o":["рентгенография органов грудной клетки","ФКГ","перфузионное и вентиляционное сканирование легких","ЭКГ"],"c":[2],"e":"Вентиляционно-перфузионная сцинтиграфия выявляет участки без кровотока при сохранной вентиляции. Сегодня стандарт — КТ-ангиопульмонография, но её среди вариантов нет.","t":"pul"},{"id":"ff84edd7","q":"Наиболее информативный тест для диагностики внешнесекреторной недостаточности поджелудочной железы:","o":["диастаза мочи","амилаза крови","гипергликемия","гиперкальциемия","эластаза кала"],"c":[4],"e":"Панкреатическая эластаза-1 в кале не разрушается при транзите; её снижение (<200 мкг/г) — признак внешнесекреторной недостаточности. Амилаза — маркер воспаления, а не недостаточности.","t":"gas"},{"id":"5349c8ea","q":"Наиболее информативным методом для выявления рака щитовидной железы является:","o":["Сцинтиграфия щитовидной железы","Пальпаторное исследование","Ультразвуковое исследование щитовидной железы","Компьютерная томография щитовидной железы","Тонкоигольная аспирационная биопсия щитовидной железы"],"c":[4],"e":"Только цитология (ТАБ) даёт морфологический ответ «рак/не рак». УЗИ подсказывает, какой узел пунктировать.","t":"end"},{"id":"2e7d277a","q":"Наиболее надежным и безопасным методом забора мочи для бак. исследования является:","o":["взятие средней порции утренней мочи во время обычного мочеиспускания","взятие порции мочи из суточного количества мочи","катетеризация мочевого пузыря","надлобковая пункция мочевого пузыря"],"c":[0],"e":"Средняя порция (после туалета) — стандарт: безопасно и достаточно надёжно. Катетеризация и пункция инвазивны и несут риск инфицирования.","t":"nef","d":"Надлобковая пункция точнее, но не «безопасна»; в тестах обычно верна средняя порция.","u":1},{"id":"a386fec6","q":"Наиболее современным и активным препаратом заместительной терапии гипотиреоза является","o":["тиреоидин","тиреотом","тиреокомб","левотироксин","трийодтиронин"],"c":[3],"e":"Л-тироксин — препарат выбора: стабильный уровень, приём 1 раз в день. Т3 действует коротко и даёт скачки; тиреоидин — устаревший экстракт.","t":"end"},{"id":"7c7b7698","q":"Наиболее специфичным симптомом при неспецифическом язвенном колите является:","o":["диарея с кровью","хроническая диарея без крови","боль в животе","лихорадка","парапроктит"],"c":[0],"e":"Почти у всех больных ЯК есть кровь в стуле (поражается слизистая прямой кишки). Парапроктит более типичен для болезни Крона.","t":"gas"},{"id":"8d92fc19","q":"Наиболее типичным отдаленным метастазом рака желудка является:","o":["печень","регионарные лимфоузлы","вирховская железа","дугласово пространство","легкие"],"c":[0],"e":"Кровь от желудка оттекает по воротной вене → первым гематогенным «фильтром» служит печень. Регионарные лимфоузлы — не отдалённые метастазы.","t":"gas"},{"id":"b2d61cdc","q":"Наиболее характерные изменения эндоскопической картины желудка при тяжелой ЖДА:","o":["слизистая желудка не изменена","слизистая желудка бледная","эрозии слизистой оболочки желудка","гиперплазия слизистой"],"c":[1],"e":"При выраженной анемии слизистые бледные, при длительном дефиците железа развиваются атрофические изменения (а не гиперплазия).","t":"hem","d":"При тяжёлой ЖДА описывают атрофию и бледность слизистой. Ключ может отличаться.","u":1},{"id":"e769efc3","q":"Наиболее характерный симптом неспецифического язвенного колита:","o":["частые кровянистые испражнения","жидкий стул","узловая эритема","артралгии","разлитая боль в животе"],"c":[0],"e":"Главный симптом ЯК — частый стул с кровью (и слизью). Эритема и артралгии — внекишечные проявления, они не обязательны.","t":"gas"},{"id":"01a6ef30","q":"Наиболее характерной локализацией неприятных ощущений, связанных с физической нагрузкой при стенокардии, является:","o":["область сердца (слева от грудины)","за грудиной","в области верхушечного толчка","рядом с мечевидным отростком грудины"],"c":[1],"e":"Типичная стенокардия — давящая боль ЗА грудиной. Колющие боли «в области сердца» на верхушке обычно некоронарные.","t":"ibs"},{"id":"f8918e62","q":"Наиболее характерные клинические симптомы холангита:","o":["боли в правом подреберье после приема жирной пищи, тошнота, рвота","приступ болей в правом подреберье с развитием желтухи, появление обесцвеченного кала, темной мочи","кратковременная боль в эпигастрии, рвота, понос","фебрильная температура с ознобом, увеличение печени, желтуха, лейкоцитоз","тупые боли в правом подреберье, отрыжка горечью"],"c":[3],"e":"Триада Шарко: лихорадка с ознобами + желтуха + боль в правом подреберье; плюс воспаление в крови.","t":"gas"},{"id":"f79bb966","q":"Наиболее характерным рентгенологическим признаком коарктации аорты является:","o":["аортальная конфигурация сердца","узурация ребер","расширение и удлинение аорты","узость восходящей части грудной аорты"],"c":[1],"e":"Расширенные межрёберные артерии (коллатерали в обход сужения) подтачивают нижние края рёбер — узуры (симптом Рёслера).","t":"ser"},{"id":"22262139","q":"Наиболее частая локализация рака желудка в России:","o":["большая его кривизна","тело","антральный отдел","кардиальный отдел","тотальное поражение"],"c":[2],"e":"Чаще всего рак желудка возникает в антральном (выходном) отделе.","t":"gas"},{"id":"15fa5477","q":"Наиболее частая причина индуцированной лекарствами дисфункции тромбоцитов, это прием:","o":["туберкулостатиков","цефалоспоринов","фторхинолонов","аспирина","\"защищенных\" пенициллинов","левомицетина"],"c":[3],"e":"Аспирин необратимо блокирует ЦОГ-1 тромбоцитов (нет тромбоксана A2) на весь срок жизни тромбоцита — 7–10 дней.","t":"hem"},{"id":"83ed72ae","q":"Наиболее частая причина развития фибрилляции предсердий в молодом возрасте:","o":["амилоидоз сердца","рестриктивная кардиомиопатия","дефект межжелудочковой перегородки","ревматизм и митральный порок сердца"],"c":[3],"e":"У молодых ФП чаще всего вызывает митральный (особенно ревматический) порок: растянутое ЛП — субстрат для аритмии. У пожилых — АГ и ИБС.","t":"ekg"},{"id":"6f378e17","q":"Наиболее частая причина экссудативного плеврита в молодом возрасте:","o":["диффузное заболевание соединительной ткани","травма грудной клетки","туберкулез","гемофилия","сахарный диабет"],"c":[2],"e":"Классическая причина экссудативного плеврита у молодых — туберкулёз; у пожилых чаще опухоль.","t":"pul"},{"id":"57d25ae8","q":"Наиболее часто рак желудка метастазирует в:","o":["щитовидную железу","яичники","печень","кости","легкие"],"c":[2],"e":"Печень — главный орган отдалённого метастазирования рака желудка (через воротную вену). Метастаз в яичники (Крукенберга) — редкий и известный, но не самый частый.","t":"gas"},{"id":"c123241e","q":"Наиболее часто проявляется дисфагией рак желудка, локализующийся в:","o":["теле желудка","области дна желудка","пилорическом отделе","в кардии","по большой кривизне"],"c":[3],"e":"Опухоль кардии сужает вход в желудок → нарушение прохождения пищи из пищевода. Рак пилоруса даёт стеноз выхода (рвоту).","t":"gas"},{"id":"1a1fe553","q":"Наиболее часто феохромоцитома локализуется:","o":["в одном надпочечнике","в обоих надпочечниках","в надпочечнике и вне надпочечника"],"c":[0],"e":"«Правило 10%»: около 90% феохромоцитом односторонние и находятся в надпочечнике; ~10% двусторонние, ~10% вненадпочечниковые.","t":"end"},{"id":"bbd0f3ce","q":"Наиболее частой гистологической формой злокачественной опухоли желудка является:","o":["аденокарцинома","плоскоклеточный рак","недифференцированный рак","саркома"],"c":[0],"e":"Слизистая желудка железистая → больше 90% опухолей — аденокарциномы. Плоскоклеточный рак типичен для пищевода.","t":"gas"},{"id":"73b7f91b","q":"Наиболее частый первый клинический признак ТЭЛА:","o":["внезапно возникающий цианоз","немотивированная выраженная внезапно возникающая одышка","акцент 2-го тона над легочной артерией","набухание шейных вен"],"c":[1],"e":"Внезапная одышка без видимой причины — самый частый (до 90%) и ранний симптом ТЭЛА.","t":"pul"},{"id":"1b9f0264","q":"Наиболее частым возбудителем хронического пиелонефрита является:","o":["протей","кишечная палочка","энтерококк","стафилококк","стрептококк"],"c":[1],"e":"E. coli — главный уропатоген (восходящая инфекция из кишечной флоры), ~70–80% случаев.","t":"nef"},{"id":"1f7ece5a","q":"Наиболее частым осложнением артериальной гипертонии у пожилых людей является:","o":["инсульты","ТЭЛА","облитерирующий атеросклероз нижних конечностей"],"c":[0],"e":"У пожилых АГ — ведущий фактор риска инсульта; ТЭЛА с АГ напрямую не связана.","t":"ag"},{"id":"8bf46ccc","q":"Наиболее частым осложнением при терапии верапамилом является:","o":["кашель","запоры","обмороки","головные боли","тахикардия"],"c":[1],"e":"Верапамил расслабляет гладкую мускулатуру кишечника → запор (самый частый побочный эффект). Он урежает пульс, а не учащает. Кашель — от ИАПФ.","t":"ag"},{"id":"f52b3d3f","q":"Наиболее эффективный препарат для купирования политопной желудочковой экстрасистолии при инфаркте миокарда","o":["хинидин","новокаинамид","кордарон","финоптин","лидокаин"],"c":[4],"e":"Лидокаин — классический препарат для желудочковых аритмий в остром периоде ИМ: действует быстро, мало влияет на сократимость.","t":"ibs","d":"Сейчас чаще применяют амиодарон (кордарон), но классический тестовый ответ — лидокаин.","u":1},{"id":"3c29464e","q":"Наиболее эффективный способ массовой профилактики йодного дефицита?","o":["йодирование соли","йодирование хлеба","йодирование воды","использование препаратов йода","использование \"йодной сетки\""],"c":[0],"e":"Всеобщее йодирование соли (рекомендация ВОЗ): соль едят все, примерно в одинаковом количестве, это дёшево. «Йодная сетка» бесполезна.","t":"end"},{"id":"13131bb6","q":"Начинать лечение аутоиммунной гемолитической анемии необходимо с:","o":["назначения нестероидных противовоспалительных препаратов","назначения иммунодепрессантов","назначения глюкокортикоидов","спленэктомии","проведения гемотрансфузий"],"c":[2],"e":"Первая линия — преднизолон. Спленэктомия и иммунодепрессанты — при неэффективности ГКС.","t":"hem"},{"id":"906a8017","q":"Не желателен для лечения артериальной гипертензии с наличием гиперурикемии","o":["гипотиазид","коринфар","каптоприл","допегит","клофелин"],"c":[0],"e":"Тиазиды снижают выведение мочевой кислоты → гиперурикемия усиливается, может спровоцировать подагру.","t":"ag"},{"id":"f05ff33f","q":"Не обладает выраженным холецистокинетическим действием:","o":["сорбит","ксилит","холецистокинин","сульфат магния","аллохол"],"c":[4],"e":"Аллохол — холеретик (усиливает образование желчи), а не холекинетик (сокращение пузыря). Сорбит, ксилит, магнезия, ХЦК стимулируют сокращение пузыря.","t":"gas"},{"id":"2bfb009e","q":"Не относится к основным симптомам портальной гипертензии:","o":["повышенное АД","образование коллатералей","кровотечение из вен пищевода, геммораидальных вен","асцит","спленомегалия"],"c":[0],"e":"Портальная гипертензия — повышение давления в воротной вене, а не системного АД. При циррозе АД скорее снижено.","t":"gas"},{"id":"20b42aec","q":"Не позволяет визуализировать желчный пузырь:","o":["ультрасонография","холецистография","холесцинтиграфия","обзорная рентгенография брюшной полости","компьютерная томография"],"c":[3],"e":"На обзорном снимке видны лишь рентгенконтрастные (кальцинированные) камни, сам пузырь — нет.","t":"gas"},{"id":"f50e7b22","q":"Не следует сочетать:","o":["бета-адреноблокаторы с диуретиками","бета-адреноблокаторы с нифедипином","ИАПФ с диуретиками","бета-адреноблокаторы с дигидропиридиновыми антагонистами Са","бета-адреноблокаторы с верапамилом"],"c":[4],"e":"ББ + верапамил: оба угнетают синусовый и АВ-узлы и сократимость → брадикардия, АВ-блокада, СН. С нифедипином (дигидропиридин) сочетание, наоборот, удачное.","t":"ag"},{"id":"2d2aa636","q":"Не является клиническим проявлением пилоростеноза:","o":["рвота, приносящая облегчение","истощение и обезвоживание","тетания","диарея","шум\"плеска\""],"c":[3],"e":"При стенозе привратника пища не проходит в кишечник → характерны запоры, а не диарея. Тетания — от потери хлора и алкалоза из-за рвоты.","t":"gas"},{"id":"68ef08c7","q":"Не является осложнением язвенной болезни 12-перстной кишки:","o":["кровотечение","пенетрация","перфорация","стеноз привратника","кардиоспазм"],"c":[4],"e":"Кардиоспазм (ахалазия) — заболевание пищевода, с язвой не связан. Остальное — классические осложнения ЯБ.","t":"gas"},{"id":"47603034","q":"Не является осложнением язвенной болезни желудка и 12 перстной кишки:","o":["кровотечение","ахалазия кардии","стеноз привратника","пенетрация","перфорация"],"c":[1],"e":"Ахалазия кардии — самостоятельная болезнь пищевода (нарушение раскрытия нижнего сфинктера).","t":"gas"},{"id":"a56a4e73","q":"Не является показанием к оперативному лечению:","o":["нефункционирующий желчный пузырь","камненосительство","механическая желтуха","эмпиема желчного пузыря"],"c":[1],"e":"Бессимптомное камненосительство обычно не оперируют — наблюдают. Остальное — показания к операции.","t":"gas","r":2},{"id":"2aa6b8fd","q":"Недостаточная эффективность фуросемида, периодически возникающая у больных с сердечной недостаточностью, обусловлена:","o":["периодически возникающем у этих больных алкалозом","ацидозом","гипоксией и гипоксемией","гипокалиемией"],"c":[0],"e":"Петлевые диуретики вызывают гипохлоремический метаболический алкалоз, на фоне которого их эффект падает. Поэтому периодически добавляют ацетазоламид (диакарб).","t":"ser"},{"id":"44493c95","q":"Непосредственным вазоконстрикторным эффектом из перечисленных обладает:","o":["калликреин","брадикинин","окись азота","ангиотензин II"],"c":[3],"e":"Ангиотензин II — мощный прямой вазоконстриктор. Брадикинин, NO — вазодилататоры, калликреин образует брадикинин.","t":"ag"},{"id":"d3535f6d","q":"Неспецифический аортоартериит встречается чаще:","o":["у женщин","у мужчин","одинаково часто у женщин и мужчин"],"c":[0],"e":"Болезнь Такаясу («болезнь отсутствия пульса») поражает преимущественно молодых женщин (до 80–90% случаев).","t":"oth"},{"id":"0a9b15be","q":"Нефросклеротическая стадия диабетической нефропатии не характеризуется","o":["отеками","гипертензией","нарушением азотовыделительной функции почек","эритроцитурией","повышением кортизола"],"c":[4],"e":"Кортизол к диабетической нефропатии отношения не имеет. Для стадии нефросклероза типичны отёки, АГ, ХПН, изменения мочи.","t":"nef"},{"id":"ae5b66d5","q":"Нехарактерной для панкреатита жалобой является:","o":["опоясывающая боль в верхней трети живота","боль в левом подреберье с иррадиацией в спину","кашицеобразный стул","рвота, приносящая облегчение","снижение или отсутствие аппетита"],"c":[3],"e":"При панкреатите рвота многократная и облегчения НЕ приносит. Рвота с облегчением — признак язвенной болезни/стеноза привратника.","t":"gas"},{"id":"6c974c3f","q":"Нормальные показатели Hb для женщин:","o":["120 г/л и выше","130 г/л и выше","140 г/л и выше"],"c":[0],"e":"Нижняя граница нормы (ВОЗ): женщины — 120 г/л, мужчины — 130 г/л, беременные — 110 г/л.","t":"hem"},{"id":"c3459214","q":"Нормальные показатели Hb для мужчин:","o":["120 г/л и выше","130 г/л и выше","140 г/л и выше"],"c":[1],"e":"Для мужчин нижняя граница — 130 г/л (у женщин 120).","t":"hem"},{"id":"10752436","q":"Нормальная продолжительность интервала PQ у взрослых людей:","o":["0,06\"-0,09\"","0,10\"-0,12\"","0,12\"-0,18\" (0,20\" при брадикардии)"],"c":[2],"e":"PQ в норме 0,12–0,20 с. Меньше 0,12 — укорочение (например, WPW), больше 0,20 — АВ-блокада I ст.","t":"ekg"},{"id":"a4605e14","q":"Нормальная продолжительность комплекса QRS у взрослых людей не более:","o":["0,08\"","0,09\" (0,10\" при брадикардии)","0,05\""],"c":[1],"e":"QRS в норме до 0,10 с. Шире 0,12 — блокада ножки пучка Гиса или желудочковый комплекс.","t":"ekg"},{"id":"bd822369","q":"Нормальные значения скорости клубочковой фильтрации для пациентов молодого и среднего возраста:","o":["70 мм/мин",">80мм/мин",">90 мм/мин"],"c":[2],"e":"СКФ ≥90 мл/мин/1,73 м² — норма (стадия С1 ХБП при наличии маркеров повреждения). 60–89 — незначительное снижение.","t":"nef"},{"id":"1ccb3eca","q":"Нормальный базальный уровень рН в фундальном отделе желудка:","o":["0,9-1,2","1,3-1,5","1,6-2,2","2,3-3,5","1,0-6,5"],"c":[2],"e":"Базальный pH тела желудка в норме ~1,6–2,0 (2,2). Ниже — гиперацидность, выше — гипоацидность.","t":"gas"},{"id":"c2bdb50d","q":"Нормальный уровень триглицеридов в сыворотке крови","o":["менее 200 мг\\дл (менее 2,3 ммоль\\л)","200-250 мг\\дл (2,3-2,8 ммоль\\л)","250-300 мг\\дл (2,8-3,4 ммоль\\л)"],"c":[0],"e":"По этим (классическим) критериям норма ТГ — до 2,3 ммоль/л. Современный желательный уровень — менее 1,7 ммоль/л.","t":"ibs"},{"id":"5b003796","q":"Нормальный уровень холестерина сыворотки крови","o":["менее 200 мг\\дл (менее 5,2 ммоль\\л)","200-250 мг\\дл (5,2-6,5 ммоль\\л)","250-300 мг\\дл (6,5-7,8 ммоль\\л)"],"c":[0],"e":"Общий холестерин в норме < 5,2 ммоль/л (по новым рекомендациям желательно < 5,0).","t":"ibs"},{"id":"ef75aa79","q":"I степенью артериальной гипертонии принято называть случаи повышения:","o":["диастолического АД более 99 мм рт ст, систолического АД более 159 мм рт ст","диастолического АД более 89 мм рт ст, систолического АД более 139 мм рт ст"],"c":[1],"e":"АГ I степени: 140–159 / 90–99. II степень: 160–179 / 100–109. III степень: ≥180 / ≥110.","t":"ag"},{"id":"9a997bc6","q":"III тон на верхушке сердца это","o":["тон наполнения","тон изгнания","тон растяжения"],"c":[0],"e":"III тон возникает в начале диастолы при быстром наполнении желудочков (колебания стенки). Тоны изгнания — систолические.","t":"ser"},{"id":"6128b6fd","q":"Абсолютный признак неоперабельности рака желудка:","o":["большие размеры опухоли","метастазы в селезенку","метастазы в большой сальник","множественные метастазы в печень"],"c":[3],"e":"Множественные отдалённые метастазы в печень делают радикальную операцию невозможной. Сальник и селезёнку можно удалить вместе с желудком.","t":"gas"},{"id":"3e07bb25","q":"Абсолютный признак перфорации язвы желудка:","o":["резкая \"кинжальная\" боль с иррадиацией в спину","исчезновение печеночной тупости","наличие свободного газа в брюшной полости","брадикардия","разлитое напряжение мышц"],"c":[2],"e":"Свободный газ (серп под диафрагмой на рентгене) — объективное доказательство перфорации полого органа. Остальные признаки бывают и при других катастрофах.","t":"gas"},{"id":"cf59f127","q":"Абсолютным показанием для инсулинотерапии не является","o":["кетоацидоз","диабетическая нефропатия","беременность и роды","отсутствие эффекта от диетотерапии","тяжелые поражения печени"],"c":[3],"e":"Если диета не помогает при СД 2 типа, сначала назначают таблетированные препараты (метформин), а не сразу инсулин.","t":"end"},{"id":"566d840c","q":"Абсолютным противопоказанием для назначения сульфаниламидов у больных СД 2 типа является","o":["кетоацидоз","сахарный диабет 2 типа со стабильным течением","латентный пиелонефрит","диабетическая нефропатия I стадии","стабильная стенокардия"],"c":[0],"e":"Кетоацидоз = абсолютная нехватка инсулина → нужен только инсулин. ПСМ лишь стимулируют секрецию собственного инсулина.","t":"end"},{"id":"3d3b5728","q":"Абсолютным противопоказанием к назначению при подагре являются:","o":["диуретики","антагонисты кальция","клофелин","каптоприл","празозин"],"c":[0],"e":"Тиазидные и петлевые диуретики задерживают мочевую кислоту → провоцируют приступы подагры.","t":"oth"},{"id":"926270ba","q":"Абсолютными противопоказаниями к проведению тромболитической терапии являются, кроме:","o":["геморрагический инсульт в анамнезе","образование головного мозга","хирургическое вмешательство в течение последнего месяца","желудочно-кишечное кровотечение 1 год назад"],"c":[3],"e":"Абсолютное противопоказание — ЖКК за последний МЕСЯЦ. Кровотечение год назад к ним не относится.","t":"ibs"},{"id":"94fb22f6","q":"Аденома, вызывающая синдром Иценко-Кушинга, является опухолью:","o":["мозгового слоя надпочечников","коркового слоя надпочечников","паренхимы почек"],"c":[1],"e":"Кортизол синтезируется в пучковой зоне КОРЫ надпочечников. Мозговой слой — катехоламины (феохромоцитома).","t":"end"},{"id":"abeedb92","q":"Алкогольное поражение сердца приходится в основном дифференцировать с:","o":["гипертрофической кардиомиопатией","дилатационной кардиомиопатией","рестриктивной кардиомиопатией"],"c":[1],"e":"Алкогольная кардиомиопатия по картине — дилатация камер и снижение сократимости, как при ДКМП. Отличие — анамнез и улучшение при отказе от алкоголя.","t":"ser"},{"id":"5c4d0a50","q":"Анаприлин не обладает свойством:","o":["расширения коронарных сосудов.","снижения потребности миокарда в кислороде.","снижение сократимости миокарда.","повышение ОПС."],"c":[0],"e":"Бета-блокаторы помогают при стенокардии, снижая потребность миокарда в O₂, а не расширяя коронарные артерии. Неселективный пропранолол даже может повышать ОПС.","t":"ibs"},{"id":"9794ad66","q":"Возможные осложнения при проведении электроимпульсной терапии","o":["фибрилляция предсердий","полная А-В блокада","синдром слабости синусового узла","тромбоэмболии","инфаркт миокарда"],"c":[3],"e":"После восстановления ритма при ФП предсердия начинают сокращаться и могут «вытолкнуть» тромб → эмболия. Поэтому перед плановой кардиоверсией нужна антикоагуляция.","t":"ekg","d":"После ЭИТ возможны и другие осложнения (асистолия, ФЖ, ожоги кожи). В тестах обычно выбирают тромбоэмболии.","u":1},{"id":"a42ca7ff","q":"Возможные проявления отека Квинке с поражением слизистой оболочки гортани:","o":["Стридорозное дыхание","Осиплость голоса","Удушье","Кашель"],"c":[0,1,2,3],"e":"Отёк гортани сужает дыхательные пути: охриплость, лающий кашель, шумное (стридорозное) дыхание вплоть до асфиксии. Верны все варианты.","t":"oth"},{"id":"421fd877","q":"Возникновение артериальной гипертензии после 55 лет, выслушивание систолического шума в околопупочной области указывает на возможность:","o":["первичного альдостеронизма.","феохромоцитомы.","реноваскулярной гипертензии.","коарктации аорты."],"c":[2],"e":"Шум около пупка — шум стенозированной почечной артерии. Поздняя АГ у пожилого — типично для атеросклеротического стеноза.","t":"ag"},{"id":"ec0128fd","q":"Возникновение гипертонии после 50 лет, выслушивание шума в околопупочной области, сопутствующие заболевания периферических артерий, указывают на возможность:","o":["первичного гиперальдостеронизма","феохромоцитомы","реноваскулярной гипертонии","коарктации аорты"],"c":[2],"e":"Системный атеросклероз (периферические артерии) + шум над почечной артерией = атеросклеротический стеноз почечной артерии.","t":"ag"},{"id":"d6f2db46","q":"Восковидные цилиндры появляются при:","o":["нефротическом синдроме","физической нагрузке","ортостатической протеинурии"],"c":[0],"e":"Восковидные цилиндры — признак тяжёлого поражения канальцев (нефротический синдром, амилоидоз, ХПН). Функциональная протеинурия их не даёт.","t":"nef"},{"id":"4bd34557","q":"Выберите наиболее рациональную комбинацию лекарственных средств при обострении хронического обструктивного панкреатита","o":["домперидон урсодезоксихолевая кислота панкреатин","мебеверин рабепразол креон","ципрофлоксацин октреотид +контрикал","ношпа фамотидин фестал"],"c":[1],"e":"Спазмолитик (мебеверин — снимает спазм сфинктера Одди) + ИПП (снижает стимуляцию железы) + микросферические ферменты без желчных кислот (креон). Фестал содержит желчь — нежелателен.","t":"gas"},{"id":"e936786c","q":"Выслушивание \"двойного\" шума Дюрозье на бедренной артерии характерно для:","o":["стеноза устья аорты","недостаточности клапана легочной артерии","недостаточности аортального клапана","недостаточности митрального клапана"],"c":[2],"e":"Двойной шум Дюрозье — периферический признак аортальной регургитации (обратный ток крови в диастолу), вместе с двойным тоном Траубе и пляской каротид.","t":"ser"},{"id":"b80c6a08","q":"Выслушивание сухих свистящих хрипов над всей поверхностью легких характерно для:","o":["повышения воздушности легких","наличия жидкости в полости плевры","нарушения бронхиальной проходимости","уплотнения легочной ткани","наличия полости в легочной ткани"],"c":[2],"e":"Свистящие хрипы рождаются в сужённых бронхах (спазм, отёк, мокрота) — синдром бронхообструкции.","t":"pul"},{"id":"e208b81f","q":"Высокий переднее-боковой инфаркт миокарда выявляется в отведениях:","o":["V1-V6","II, III, aVF","V1-V6 на 2 ребра выше","V3R-V6R"],"c":[2],"e":"Высокие боковые отделы ЛЖ «видны» в I, aVL и грудных отведениях, поставленных на 1–2 межреберья выше обычного. II, III, aVF — нижний ИМ; V3R–V6R — ИМ ПЖ.","t":"ibs"},{"id":"3ef37199","q":"Высокий уровень амилазы сыворотки крови не характерен для:","o":["острого панкреатита","хронической застойной сердечной недостаточности","внематочной беременности","разрыва панкреатической кисты","инфекционного паротита"],"c":[1],"e":"Амилаза выделяется поджелудочной и слюнными железами (паротит), повышается при панкреатите, разрыве кисты, внематочной беременности (маточные трубы). ХСН здесь ни при чём.","t":"gas"},{"id":"0f48e865","q":"Высокоинформативным диагностическим критерием хронического панкреатита при УЗИ является:","o":["диффузное равномерное повышение эхоплотности поджелудочной железы","преходящее расширение вирсунгова протока","увеличение сагиттального размера головки поджелудочной железы до 30 мм","кальцинаты ткани поджелудочной железы"],"c":[3],"e":"Кальцинаты — достоверный признак хронического панкреатита. Повышение эхогенности неспецифично (бывает при липоматозе, в старости).","t":"gas"},{"id":"de52827e","q":"Гематогенное проникновение стафилококка в легкие приводит к развитию:","o":["единичного абсцесса","множественных тонкостенных полостей","пневмосклероза","гнойного плеврита","спонтанного пневмоторакса"],"c":[1],"e":"Септическая стафилококковая пневмония даёт множество мелких полостей (буллы, «стафилококковая деструкция»).","t":"pul"},{"id":"de810e3c","q":"Гематомный тип кровоизлияний характерен исключительно для:","o":["болезни Рандю-Ослера","тромбастении Гланцмана","гемофилии А","болезни (синдрома) Верльгофа","болезни Виллебранда-Юргенса"],"c":[2],"e":"Гематомы (в суставы, мышцы) — признак дефицита факторов свёртывания (гемофилии). Тромбоцитарные нарушения дают петехии и синяки; Рандю-Ослер — ангиоматозный тип.","t":"hem"},{"id":"a35277c4","q":"Гемодинамически значимым сужением коронарных артерий считается уменьшение внутреннего диаметра правой коронарной артерии или ветвей левой коронарной артерии на:","o":["25%","50%","75%","90%"],"c":[2],"e":"Значимым считают стеноз крупной коронарной артерии ≥70–75% (для ствола ЛКА — ≥50%).","t":"ibs","d":"Сейчас чаще говорят о ≥70%; из вариантов ближе всего 75%.","u":1},{"id":"7b9b8032","q":"Гемодинамически значимым уровнем стенозирования крупных коронарных артерий при ИБС считают:","o":["стеноз > 30%","стеноз > 50%","стеноз > 70%","стеноз > 90%"],"c":[2],"e":"Для крупных эпикардиальных артерий значим стеноз >70%. Исключение — ствол ЛКА: уже >50%.","t":"ibs"},{"id":"bb0f88cb","q":"Гемодинамически значимым уровнем стенозирования ствола левой коронарной артерии при ИБС считают:","o":["стеноз > 30%","стеноз > 50%","стеноз > 70%","стеноз > 90%"],"c":[1],"e":"Ствол ЛКА кровоснабжает большую часть ЛЖ, поэтому для него порог ниже — >50%.","t":"ibs"},{"id":"1beb3557","q":"Гемодинамические эффекты нитроглицерина не включают:","o":["снижение давления заклинивания в легочной артерии.","повышение числа сердечных сокращений.","снижение постнагрузки левого желудочка.","снижение центрального венозного давления.","повышение сократимости миокарда."],"c":[4],"e":"Нитраты — вазодилататоры (снижают пред- и постнагрузку, рефлекторно учащают пульс). На сократимость напрямую не влияют.","t":"ibs"},{"id":"d7bb0e60","q":"Гиперпродукция глюкокортикоидов выражена при:","o":["синдроме Конна","синдроме Кушинга","феохромоцитоме"],"c":[1],"e":"Кушинг — избыток кортизола. Конн — альдостерона, феохромоцитома — катехоламинов.","t":"end"},{"id":"466b724a","q":"Гиперрениновые формы артериальной гипертонии наиболее характерны для следующих заболеваний:","o":["гипертонической болезни","стеноз почечных артерий","первичного гиперальдостеронизма (синдром Кона)"],"c":[1],"e":"Почка за стенозом «чувствует» низкое давление и выделяет много ренина. При Конне ренин, наоборот, подавлен.","t":"ag"},{"id":"d9d60e38","q":"Гипертензивным эффектом сопровождается стимуляция:","o":["центральных альфа-адренорецепторов","периферических альфа-адренорецепторов"],"c":[1],"e":"Стимуляция периферических α1-рецепторов сосудов → вазоконстрикция → рост АД. Центральные α2 (клонидин) — снижают АД.","t":"ag"},{"id":"9e2139af","q":"Гипертоническая болезнь:","o":["полигенное заболевание","моногенное заболевание"],"c":[0],"e":"В развитии ГБ участвует множество генов и внешних факторов; моногенные формы АГ (Лиддла и др.) редки.","t":"ag"},{"id":"3a9fdd69","q":"Гипертонические кризы, сопровождающиеся сильной головной болью, потливостью и сердцебиением, характерны для:","o":["первичного гиперальдостеронизма","феохромоцитомы","реноваскулярной гипертонии","коарктации аорты"],"c":[1],"e":"Триада феохромоцитомы: головная боль + потливость + сердцебиение во время криза — выброс катехоламинов.","t":"ag","r":2},{"id":"28060f65","q":"Гипертрофия миокарда левого желудочка наиболее выражена при:","o":["митральном стенозе","недостаточности митрального клапана","недостаточности аортального клапана","стенозе устья аорты"],"c":[3],"e":"При аортальном стенозе ЛЖ работает против огромного сопротивления (перегрузка давлением) → самая выраженная концентрическая гипертрофия.","t":"ser"},{"id":"28ec0c2b","q":"Гипогликемии способствуют","o":["развитию гепатитов","грибковому поражению кожи","развитию инфаркта миокарда","развитию инсулинорезистентности"],"c":[2],"e":"При гипогликемии выбрасываются катехоламины → тахикардия, спазм, рост потребности в O₂ → риск ишемии и ИМ, аритмий.","t":"end"},{"id":"95133f82","q":"Гипокалиемия при первичном гиперальдостеронизме связана с:","o":["увеличением фильтрации калия в почечных клубочках","уменьшением реабсорбции калия в проксимальном отделе канальцев","увеличением секреции калия в дистальном отделе канальцев"],"c":[2],"e":"Альдостерон в дистальных канальцах и собирательных трубках задерживает натрий в обмен на калий → потеря калия с мочой.","t":"ag"},{"id":"cc660372","q":"Гипостенурия это колебания относительной плотности мочи в пределах:","o":["1005-1008","1010-1015","1010-1020"],"c":[0],"e":"Гипостенурия — стойко низкая плотность мочи (ниже 1010), почки не концентрируют мочу. Норма колебаний — примерно 1010–1025.","t":"nef"},{"id":"8b8c6465","q":"Гипотензивное действие дроперидола преимущественно связано с:","o":["блокадой бета-адренорецепторов","блокадой альфа-адренорецепторов","седативным действием"],"c":[1],"e":"Дроперидол (нейролептик) обладает α-адреноблокирующим действием → расширение сосудов и снижение АД.","t":"ag"},{"id":"84ab186f","q":"Гипотензивное действие клонидина связано с:","o":["блокадой бета-адренорецепторов","уменьшением содержания ренина в плазме крови","блокадой альфа-адренорецепторов ЦНС","уменьшением объема циркулирующей плазмы"],"c":[2],"e":"Клонидин действует через центральные α2-рецепторы (точнее, стимулирует их), снижая симпатический тонус. Здесь верен вариант про центральные α-рецепторы.","t":"ag","d":"Фармакологически клонидин — агонист (стимулятор) центральных α2-рецепторов, но в тесте верный ответ именно этот."},{"id":"a333b7df","q":"Гипотензивный эффект ИАПФ может уменьшаться при сочетанном приёме:","o":["клопидогреля","седативных препаратов","НПВС"],"c":[2],"e":"НПВС подавляют синтез сосудорасширяющих простагландинов и задерживают натрий → ослабляют эффект ИАПФ и диуретиков.","t":"ag"},{"id":"41ab9133","q":"Гипотензивным действием обладают следующие простагландины:","o":["простагландин ЕI","простакцилин","тромбоксан","простагландин F"],"c":[0,1],"e":"Сосуды расширяют простагландин E1 и простациклин (PGI2). Тромбоксан A2 и PGF2α — вазоконстрикторы.","t":"ag"},{"id":"5b9e3a82","q":"Гипотензивным эффектом сопровождается стимуляция:","o":["центральных альфа-адренорецепторов","периферических альфа-адренорецепторов","центральных и периферических альфа-адренорецепторов","ни одного из перечисленных"],"c":[0],"e":"Стимуляция центральных α2-рецепторов (клонидин, метилдопа) снижает симпатическую активность → АД падает.","t":"ag"},{"id":"d24fd7d7","q":"Главная причина формирования ХОБЛ:","o":["инфекционный агент","эндогенная интоксикация","раздражение поллютантами","аллергия","курение"],"c":[4],"e":"Курение — причина ~80–90% случаев ХОБЛ.","t":"pul"},{"id":"a4bacae2","q":"Головную боль вызывает прием","o":["нитратов","бета-блокаторов","антагонистов кальция","нитратов и бета-блокаторов","нитратов и антагонистов кальция"],"c":[4],"e":"И нитраты, и антагонисты Ca (особенно дигидропиридины) расширяют сосуды мозга → головная боль. Бета-блокаторы её не вызывают (даже применяются при мигрени).","t":"ibs"},{"id":"da6038e9","q":"Госпитализация больных с впервые возникшей стенокардией:","o":["показана всем больным","не показана","показана в отдельных случаях","решается индивидуально"],"c":[0],"e":"Впервые возникшая стенокардия относится к нестабильной (ОКС) — высокий риск ИМ, поэтому показана экстренная госпитализация.","t":"ibs"},{"id":"239ede50","q":"Двойная дезагрегантная терапия после имплантации стентов с лекарственным покрытием по поводу острого коронарного синдрома должна проводиться не менее:","o":["2 недель","1 месяца","3 месяцев","12 месяцев"],"c":[3],"e":"При ОКС стандартная длительность ДАТТ (аспирин + ингибитор P2Y12) — 12 месяцев.","t":"ibs"},{"id":"b592ff17","q":"Деструкция легочной ткани наиболее часто развивается при пневмонии, вызванной","o":["пневмококком","стрептококком","стафилококком","вирусами","микоплазмой"],"c":[2],"e":"Стафилококк выделяет ферменты-токсины, разрушающие ткань → абсцессы и полости.","t":"pul"},{"id":"77083d4f","q":"Диагноз В-12-фолиеводефицитной анемии доказывается исследованием:","o":["уровня Нв","кривой Прайс-Джонса","данными миелограммы","данными ФГДС (атрофический гастрит)","синдромом фуникулярного миелоза"],"c":[2],"e":"Мегалобластный тип кроветворения в костном мозге (стернальная пункция) — доказательство диагноза. Пункцию делают ДО введения B12.","t":"hem"},{"id":"12aeaeeb","q":"Диагноз гастро-эзофагеальной рефлюксной болезни:","o":["может быть установлен на основании жалоб и анамнеза","исключается при нормальной эндоскопической картине в пищеводе","требует обязательного гистологического подтверждения"],"c":[0],"e":"Типичные изжога и регургитация позволяют поставить ГЭРБ клинически. Существует неэрозивная форма — нормальная эндоскопия её не исключает.","t":"gas"},{"id":"cefe3161","q":"Диагноз пищевода Барретта должен быть установлен:","o":["клинически","при эндоскопическом осмотре","при гистологическом исследовании биоптата слизистой пищевода","при рентгеноскопии пищевода"],"c":[2],"e":"Барретт — кишечная метаплазия эпителия, увидеть её можно только под микроскопом. Эндоскопия даёт подозрение.","t":"gas"},{"id":"c2b84826","q":"Диагноз сахарного диабета по уровню венозной плазмы натощак ставят при гликемии (ммоль/л)","o":["3,3-5,5 натощак","более 6,1 натощак","более 6,7 натощак","более 7,0 натощак"],"c":[3],"e":"Критерий СД по венозной плазме натощак — ≥7,0 ммоль/л (дважды) или ≥11,1 ммоль/л в любое время. Значения 6,1–6,9 — нарушенная гликемия натощак.","t":"end"},{"id":"0139d08a","q":"Диагностическая проба при безболевой ишемии миокарда:","o":["ЭКГ","R-грамма грудной клетки","УЗИ сердца","изотопная вентрикулография","холтеровский мониторинг ЭКГ"],"c":[4],"e":"Безболевые эпизоды больной не замечает — их ловит только длительная запись ЭКГ (холтер).","t":"ibs"},{"id":"c9907bc4","q":"Диагностически значимая концентрация тропонина в крови после развития некроза миокарда определяется через:","o":["1 час","3 часа","6 часов","12 часов"],"c":[1],"e":"Обычный тропонин начинает повышаться через ~3–4 часа от начала некроза, пик — 12–48 ч, держится до 10–14 суток.","t":"ibs","d":"Высокочувствительный тропонин позволяет судить уже через 1 час; в разных тестах ключ — 3 или 6 ч.","u":1},{"id":"08b41cce","q":"Диагностический признак гемофилии:","o":["снижение фибриногена","удлинение времени кровотечения","удлинение времени свертывания крови","снижение протромбинового показателя","нарушение ретракции кровяного сгустка"],"c":[2],"e":"Дефицит фактора VIII/IX → удлинено время свёртывания (и АЧТВ). Время кровотечения и тромбоциты в норме.","t":"hem"},{"id":"c2f98573","q":"Диарея с кровью характерна для дебюта:","o":["болезни Крона","целиакии","синдрома раздраженного кишечника","язвенного колита","дивертикулеза кишечника"],"c":[3],"e":"ЯК всегда начинается с прямой кишки → кровь в стуле с самого начала. При СРК крови не бывает (это «симптом тревоги»).","t":"gas"},{"id":"5ace9e63","q":"Диспансерное наблюдение больных железодефицитной анемией осуществляет:","o":["гематолог","терапевт"],"c":[1],"e":"ЖДА — частая «терапевтическая» анемия; ведёт её участковый терапевт. Гематолог — при сложных и неясных случаях.","t":"hem"},{"id":"9ca03358","q":"Длительность лечения антибактериальными препаратами острых бактериальных синуситов должна составлять:","o":["3-5 дней","5-7 дней","7-10 дней","Не менее 10 дней","10-14 дней и более"],"c":[2],"e":"Обычный курс антибиотика при остром бактериальном синусите — 7–10 дней (в тяжёлых случаях дольше).","t":"pul","d":"Рекомендации разнятся (от 5–7 до 10–14 дней); проверьте ключ своей кафедры.","u":1},{"id":"91665d88","q":"Длительность приема тирозола при терапии диффузного токсического зоба составляет:","o":["2-3 мес","4-6 мес","7-11 мес","12-18 мес","19-24 мес"],"c":[3],"e":"Консервативная терапия ДТЗ тиреостатиками длится 12–18 месяцев, после этого оценивают ремиссию.","t":"end"},{"id":"225d017d","q":"Длительную ремиссию язвенной болезни обеспечивает:","o":["красный рубец","купирование болевого синдрома","белый рубец","эрадикация (уничтожение) пилорического хеликобактера"],"c":[3],"e":"Устранение хеликобактера резко снижает частоту рецидивов язвы — это главный способ добиться стойкой ремиссии.","t":"gas"},{"id":"c796f99c","q":"Для 1-ой степени увеличения щитовидной железы характерно:","o":["пальпируется перешеек щитовидной железы","пальпируются доли щитовидной железы, не превышающие концевую фалангу большого пальца обследуемого","железа, видимая при обычном положении шеи"],"c":[0],"e":"По Николаеву: 0 — не пальпируется; I — пальпируется перешеек; II — пальпируются доли; III — видна при глотании («толстая шея»).","t":"end"},{"id":"8b27af2a","q":"Для рака головки поджелудочной железы не характерно наличие:","o":["повышения уровня ЩФ","появления желтухи после приступа болей","гипергликемии","интенсивной желтухи с зудом","увеличение желчного пузыря"],"c":[1],"e":"Желтуха после болевого приступа — признак камня (холедохолитиаз). При раке желтуха нарастает постепенно и безболезненно, с увеличенным пузырём (симптом Курвуазье).","t":"gas"},{"id":"d6ae7bea","q":"Для артериальной гипертонии при тиреотоксикозе характерно:","o":["повышение диастолического АД","снижение диастолического АД","повышение систолического АД","увеличение пульсового АД"],"c":[3],"e":"При тиреотоксикозе САД растёт (большой ударный объём), а ДАД падает (расширение периферических сосудов) → пульсовое давление увеличено.","t":"end"},{"id":"b83398e3","q":"Для блокады правой ножки пучка Гиса характерно появление широкого, но неглубокого зубца S в отведениях:","o":["V1-V2","V1-V6","V5-V6","III, aVF"],"c":[2],"e":"При БПНПГ в V1–V2 комплекс rSR' («М»), а в левых отведениях (I, V5–V6) — широкий зазубренный S.","t":"ekg"},{"id":"81dc50a8","q":"Для болевого синдрома при хроническом панкреатите характерно:","o":["боль облегчается при тепловых процедурах","прием пищи облегчает боль","боль усиливается натощак","боль обостряется после приема пищи"],"c":[3],"e":"Еда стимулирует секрецию железы → боль через 30–60 мин после еды (особенно жирной). Боль натощак, облегчающаяся едой, — язва ДПК.","t":"gas"},{"id":"30e10c1a","q":"Для больного с гипотиреозом не характерно:","o":["отечности век, губ, кистей, стоп и т.д.","сухой бледной кожи с желтоватым оттенком, холодной на ощупь","выпадения волос","медлительности, заторможенности, сонливости","снижения массы тела"],"c":[4],"e":"При гипотиреозе обмен замедлен → вес, наоборот, растёт (отёки, микседема). Похудание — признак тиреотоксикоза.","t":"end"},{"id":"47d154b0","q":"Для больных со злокачественной артериальной гипертонией характерны:","o":["гематурия","цилиндрурия","высокая протеинурия"],"c":[0,1,2],"e":"Злокачественная АГ вызывает фибриноидный некроз артериол почек → протеинурия, эритроциты и цилиндры в моче, быстрое падение функции почек.","t":"ag","d":"Вероятно, в оригинале несколько правильных ответов; если в тесте один — чаще выбирают высокую протеинурию.","u":1},{"id":"06bf4cfb","q":"Для бронхиальной обструкции не характерно:","o":["задержка мокроты.","ларингоспазм.","воспаление бронхов.","бронхоспазм.","отек слизистой оболочки."],"c":[1],"e":"Ларингоспазм — сужение гортани (верхние дыхательные пути), а не бронхов. Остальное — механизмы бронхообструкции.","t":"pul"},{"id":"706ce48b","q":"Для бронхиальной обструкции характерно снижение:","o":["диффузионной способности легких.","остаточного объема легких.","максимальной вентиляции легких (МВЛ).","пробы Тиффно.","жизненной емкости легких(ЖЕЛ).","снижение ОФВ1 и ПСВ."],"c":[3,5],"e":"Главные спирометрические признаки обструкции: снижение ОФВ1, ПСВ и индекса Тиффно (ОФВ1/ЖЕЛ < 70%). Остаточный объём при обструкции, наоборот, растёт.","t":"pul","d":"МВЛ при обструкции тоже снижается; в некоторых ключах верным считают только «снижение ОФВ1 и ПСВ».","u":1},{"id":"a1196003","q":"Для всасывания витамина В12 необходимо:","o":["соляная кислота","гастрин","гастромукопротеин","пепсин","фолиевая кислота"],"c":[2],"e":"Гастромукопротеин = внутренний фактор Касла (выделяется париетальными клетками). Без него B12 в подвздошной кишке не всасывается.","t":"hem"},{"id":"86359f3a","q":"Для гипертонической болезни первой стадии характерно","o":["транзиторное повышение АД","ЭКГ-признаки гипертрофии миокарда","нарушение функции почек","геморрагии в сетчатке"],"c":[0],"e":"I стадия ГБ — повышенное АД без поражения органов-мишеней. Гипертрофия ЛЖ — II стадия, кровоизлияния и почечная недостаточность — III.","t":"ag"},{"id":"a6b8f476","q":"Для гипертрофии левого желудочка характерно:","o":["RV1>RV2>RV3","RV6>RV5>RV4","RV3>RV4>RV5-V6"],"c":[1],"e":"В норме самый высокий R в V4. При гипертрофии ЛЖ максимальный R смещается влево: RV5–V6 > RV4.","t":"ekg"},{"id":"4fe347cf","q":"Для гипогликемической комы характерно:","o":["высокий уровень сахара крови","быстрое развитие комы","запах ацетона","шумное дыхание","сухость кожных покровов"],"c":[1],"e":"Гипогликемическая кома развивается за минуты, кожа влажная. Ацетон, шумное дыхание Куссмауля и сухость — признаки кетоацидотической комы.","t":"end"},{"id":"acf5ac46","q":"Для гипотиреоза не характерны следующие изменения на ЭКГ","o":["брадикардия","снижение интервала S-T ниже изоэлектрической линии","инверсия зубца Т","малый вольтаж зубцов","увеличенный вольтаж зубцов"],"c":[4],"e":"Микседема (и выпот в перикарде) даёт низкий вольтаж. Высокий вольтаж — скорее тиреотоксикоз.","t":"end"},{"id":"52b99606","q":"Для гипотиреоза характерно:","o":["увеличение уровня св.Т4 в крови","увеличение уровня св.Т3 в крови","увеличение уровня общего Т4 в крови","увеличение уровня общего Т3 в крови","повышение уровня ТТГ в крови"],"c":[4],"e":"При первичном гипотиреозе щитовидная железа «не отвечает», гипофиз пытается её подстегнуть → ТТГ растёт, T4 снижен.","t":"end"},{"id":"ab267fe0","q":"Для диагностики бронхоэктазов наиболее информативным является проведение:","o":["МСКТ высокого разрешения или бронхографии","бронхоскопии","рентгеноскопии легких","спирографии"],"c":[0],"e":"КТ высокого разрешения — стандарт диагностики бронхоэктазов (раньше — бронхография).","t":"pul"},{"id":"bbf25c47","q":"Для диагностики реноваскулярной артериальной гипертонии достаточно:","o":["проведения экскреторной урографии","определения концентрации ренина в плазме крови","проведения ангиографии почечных артерий","УЗИ почек"],"c":[2],"e":"Ангиография показывает стеноз напрямую и достаточна для диагноза. Ренин и урография — лишь косвенные данные.","t":"ag"},{"id":"a970c89c","q":"Для длительного применения при запорах можно рекомендовать:","o":["препараты сенны","пикосульфат натрия","лактулозу","бисакодил"],"c":[2],"e":"Лактулоза — осмотическое слабительное, не вызывает привыкания и повреждения нервного аппарата кишки. Стимулирующие (сенна, бисакодил, пикосульфат) — только короткими курсами.","t":"gas"},{"id":"09a56131","q":"Для ЖДА характерно:","o":["моноцитопения","тромбоцитоз","ретикулоцитоз","нейтропения"],"c":[1],"e":"Дефицит железа часто сопровождается реактивным тромбоцитозом. Ретикулоциты при ЖДА в норме или снижены (растут только на фоне лечения).","t":"hem"},{"id":"06fe9880","q":"Для железодефицитной анемии характерно:","o":["накопление железа в печени","высокий уровень ферритина в крови","гипохромия и микроцитоз эритроцитов","мегалобластоз костного мозга"],"c":[2],"e":"ЖДА — гипохромная микроцитарная анемия (низкие MCV, MCH) с низким ферритином. Мегалобластоз — при дефиците B12/фолатов.","t":"hem"},{"id":"fc17d32e","q":"Для замещающего идиовентрикулярного ритма характерна ЧСС:","o":["50-70 в 1 мин","менее 30 (40)в 1 мин","60-80 в 1 мин","90-100 в 1 мин"],"c":[1],"e":"Водители ритма в желудочках самые медленные: 20–40 в мин. АВ-узловой ритм — 40–60.","t":"ekg"},{"id":"c582b14d","q":"Для злокачественного течения артериальной гипертонии характерно:","o":["ретинопатия III-IV ст","атеросклероз сосудов нижних конечностей","нарушения ритма сердца","появление блокад сердца"],"c":[0],"e":"Ключевой признак злокачественной АГ — тяжёлая ретинопатия (кровоизлияния, экссудаты, отёк диска зрительного нерва) при очень высоком АД.","t":"ag"},{"id":"70ecf78b","q":"Для какого из перечисленных синдромов характерны кожный зуд, повышение конъюгированного билирубина, щелочной фосфатазы и холестерина:","o":["гемолитической желтухи","синдрома Жильбера","синдрома холестаза","паренхиматозной желтухи"],"c":[2],"e":"Застой желчи: в крови накапливаются её компоненты — прямой билирубин, желчные кислоты (зуд), холестерин, растут ЩФ и ГГТ.","t":"gas"},{"id":"0b045f05","q":"Для клиники центрального рака легкого наиболее характерно:","o":["анемия","рецидивирующая пневмония","стридорозное дыхание","рецидивирующий пневмоторакс","ателектаз"],"c":[1],"e":"Опухоль в крупном бронхе нарушает дренаж → повторные пневмонии в одном и том же сегменте/доле (обтурационный пневмонит).","t":"pul","d":"Ателектаз тоже типичен для центрального рака; в некоторых ключах верным считают его.","u":1},{"id":"7fe8b487","q":"Для клинических проявлений остеопороза в постменопаузе не характерно","o":["снижения роста до 10-12 см","наличия болевого синдрома с преимущественным поражением позвоночного столба","тахикардии","искривления позвоночного столба","деформации грудной клетки"],"c":[2],"e":"Остеопороз проявляется переломами позвонков: снижение роста, боли, кифоз, деформация грудной клетки. К сердцу отношения не имеет.","t":"oth"},{"id":"53dfbe35","q":"Для коарктации аорты характерно","o":["повышение системного артериального давления","повышение артериального давления только на нижних конечностях","повышение артериального давления только на верхних конечностях"],"c":[2],"e":"Сужение ниже отхождения подключичных артерий: на руках АД высокое, на ногах — низкое/нормальное, пульс на бедренных ослаблен.","t":"ser"},{"id":"f68f1bf7","q":"Для крупозной пневмонии характерно:","o":["познабливание","удушье","высокая лихорадка","легочное кровотечение","свистящее дыхание"],"c":[2],"e":"Начало острое: потрясающий озноб, лихорадка 39–40°C, боль в боку, затем «ржавая» мокрота.","t":"pul"},{"id":"d39adb31","q":"Для купирования гипертонического криза, осложненного острой левожелудочковой недостаточностью, следует использовать внутривенное введение:","o":["лазикса","верапамила","сердечных гликозидов","обзидана"],"c":[0],"e":"Фуросемид быстро разгружает малый круг (венодилатация + диурез) при отёке лёгких. Верапамил и обзидан угнетают сократимость — опасны.","t":"ag"},{"id":"a4ba7efa","q":"Для легкой формы диффузно-токсического зоба не характерно:","o":["повышение нервной возбудимости","похудание на 10-15% от исходной массы тела","постоянная тахикардия не более 100 ударов в 1 мин.","постоянная тахикардия более 100 ударов в 1 мин.","некоторое снижение трудоспособности"],"c":[3],"e":"При лёгком тиреотоксикозе пульс до 100 (80–100). Тахикардия 100–120 — средняя тяжесть, свыше 120 — тяжёлая.","t":"end"},{"id":"8d7cfe02","q":"Для лечения артериальной гипертонии у больных с нарушением азотовыделительной функцией почки не рекомендуется использовать:","o":["гипотиазид","апрессин","нифедипин","фуросемид"],"c":[0],"e":"Тиазиды неэффективны при СКФ < 30 мл/мин и ухудшают функцию почек. При ХПН используют петлевые диуретики (фуросемид).","t":"ag"},{"id":"ddae5e8e","q":"Для лечения больных с артериальной гипертонией и облитерирующим атеросклерозом сосудов нижних конечностей противопоказано применение:","o":["нифедипина","верапамила","пропранолола","празозина"],"c":[2],"e":"Неселективный β-блокатор блокирует β2-рецепторы сосудов мышц → вазоконстрикция, ухудшение кровотока в ногах (перемежающаяся хромота).","t":"ag"},{"id":"a0625ab9","q":"Для лечения гипертонического криза при феохромоцитоме наиболее эффективным является внутривенное введение","o":["фентоламина","пентамина","клофелина","дибазола"],"c":[0],"e":"Криз вызван катехоламинами через α-рецепторы → нужен α-адреноблокатор фентоламин. Бета-блокатор до α-блокады назначать нельзя.","t":"ag"},{"id":"60ebc08a","q":"Для лечения гипотиреоза не применяют","o":["эутирокс","трийодтиронин","тироксин","тиреотом","тирозол"],"c":[4],"e":"Тирозол (тиамазол) — тиреостатик, применяется при тиреотоксикозе. Остальные — гормоны щитовидной железы.","t":"end"},{"id":"8f41a2f8","q":"Для лечения лабильной артериальной гипертонии у больных с гиперкинетическим типом кровообращения в первую очередь целесообразно использовать:","o":["блокаторы бета-адренорецепторов","нифедипин","апрессин","празозин"],"c":[0],"e":"Гиперкинетический тип = высокий сердечный выброс и тахикардия (симпатикотония) → бета-блокаторы. Вазодилататоры усилят тахикардию.","t":"ag"},{"id":"9bdd1348","q":"Для лечения неспецифического аортоартериита в период обострения целесообразно использовать:","o":["антибиотики","сульфаниламиды","глюкокортикоиды","делагил"],"c":[2],"e":"Такаясу — аутоиммунный васкулит; обострение лечат преднизолоном (+ цитостатики). Инфекции нет — антибиотики бесполезны.","t":"oth"},{"id":"5755f6e6","q":"Для манифестной формы гипотиреоза характерно:","o":["повышение ТТГ, нормальный уровень Т4","повышение ТТГ, сниженный уровень Т4","снижение ТТГ, повышенный уровень Т4","снижение ТТГ, нормальный уровень Т4"],"c":[1],"e":"Манифестный гипотиреоз: ТТГ↑ + св. T4↓. Субклинический: ТТГ↑ при нормальном T4. Низкий ТТГ — тиреотоксикоз.","t":"end"},{"id":"2e557f24","q":"Для манифестной формы диффузно-токсического зоба не характерно:","o":["значительное повышение нервной возбудимости","снижение трудоспособности","сонливость","уменьшение массы тела на 20% от исходной","постоянная тахикардия от 100 до 120 ударов в 1 мин"],"c":[2],"e":"При тиреотоксикозе бессонница и возбуждение. Сонливость — признак гипотиреоза.","t":"end"},{"id":"318c9382","q":"Для митрального стеноза характерна следующая аускультативная симптоматика:","o":["хлопающий I тон на верхушке сердца, щелчок открытия митрального клапана, мезодиастолический и пресистолический шумы на верхушке сердца","акцент II тона на верхушке сердца, щелчок открытия митрального"],"c":[0],"e":"«Ритм перепела»: хлопающий I тон + II тон + щелчок открытия; диастолический шум с пресистолическим усилением. Акцент II тона при МС — над лёгочной артерией, а не на верхушке.","t":"ser"},{"id":"e492c2c8","q":"Для недостаточности клапанов аорты характерно:","o":["снижение систолического АД","повышение систолического АД","уменьшение пульсового давления","нормальное систолическое и диастолическое АД"],"c":[1],"e":"При аортальной недостаточности большой ударный объём → САД растёт; обратный ток → ДАД низкое (вплоть до 0). Пульсовое давление велико.","t":"ser"},{"id":"bdf8aee6","q":"Для нефрогенной артериальной гипертензии не характерно:","o":["эпизоды резкого подъема АД с сильными вегетативными кризами","мочевой синдром в анамнезе","массивные отеки"],"c":[0],"e":"Кризы с вегетативными симптомами (потливость, сердцебиение) — признак феохромоцитомы, а не почечной АГ.","t":"ag"},{"id":"f4829191","q":"Для осложненной формы диффузно-токсического зоба не характерно:","o":["повышения АД","появления мерцательной аритмии","появления сердечной недостаточности","тиреотоксического поражения сердца","прибавки массы тела"],"c":[4],"e":"Тиреотоксикоз сопровождается похуданием. Мерцательная аритмия и СН — типичные осложнения («тиреотоксическое сердце»).","t":"end"},{"id":"8098c08f","q":"Для острого ателектаза наиболее типично:","o":["боль в грудной клетке","внезапная одышка и удушье","сильный внезапный кашель","кровотечение","смещение органов средостения в здоровую сторону"],"c":[1],"e":"Внезапное выключение участка лёгкого из дыхания → одышка. Средостение при ателектазе смещается в БОЛЬНУЮ сторону (в здоровую — при выпоте/пневмотораксе).","t":"pul"},{"id":"cbb50747","q":"Для острой стадии инфаркта в крови не характерно:","o":["увеличение уровня миоглобина.","увеличение уровня АСТ.","появление С-реактивного белка.","увеличение активности ЩФ.","увеличение МВ-фракции КФК."],"c":[3],"e":"ЩФ — маркер холестаза и костей, а не некроза миокарда. Миоглобин, КФК-МВ, АСТ, тропонин — маркеры ИМ.","t":"ibs"},{"id":"9461c947","q":"Для острой стадии инфаркта миокарда характерно:","o":["реципрокное смещение сегмента ST в противоположных отведениях","отсутствие реципрокных изменений","отрицательный зубец Т"],"c":[0],"e":"Подъём ST в зоне ИМ сопровождается зеркальной (реципрокной) депрессией ST в противоположных отведениях — это отличает ИМ от перикардита.","t":"ibs"},{"id":"8384abf4","q":"Для оценки внутрисекреторной функции поджелудочной железы применяют:","o":["определение эластазы кала","определение амилазы мочи","стандартный тест толерантности к глюкозе","выраженность стеатореи","определение соотношения трипсин/ингибитор трипсина в крови"],"c":[2],"e":"Внутрисекреторная (эндокринная) функция — это инсулин, её проверяют по углеводному обмену (ОГТТ). Эластаза и стеаторея — внешнесекреторная функция.","t":"gas"},{"id":"2920b91c","q":"Для преодоления рефрактерности к петлевым диуретикам при лечении сердечной недостаточности показаны:","o":["препараты калия","ингибиторы АПФ","сердечные гликозиды","вазодилататоры","вазопрессоры"],"c":[1],"e":"ИАПФ блокируют РААС (альдостерон задерживает натрий) и улучшают почечный кровоток → восстанавливают ответ на диуретики. Также помогают комбинации диуретиков.","t":"ser","d":"Ключ по этому вопросу может отличаться; классический ответ в отечественных тестах — ИАПФ.","u":1},{"id":"2c0ca008","q":"Для первичного гемохроматоза не характерно:","o":["цирроз печени","сахарный диабет","синдром мальабсорбции","меланодермия"],"c":[2],"e":"Классическая триада гемохроматоза: цирроз + сахарный диабет + бронзовая кожа («бронзовый диабет»). Мальабсорбции нет — железо, наоборот, всасывается избыточно.","t":"gas"},{"id":"cdcc8874","q":"Для первичного гиперальдостеронизма (синдром Кона) характерно:","o":["кризовое течение артериальной гипертонии","стабильное повышение АД без кризов","нормальное АД"],"c":[1],"e":"При Конне АГ стабильная, плохо поддаётся лечению, кризы нехарактерны (в отличие от феохромоцитомы).","t":"ag","r":2},{"id":"834a5c92","q":"Для первого типа гиперлипопротеинемии не характерно:","o":["повышение содержания хиломикронов","повышение содержания триглицеридов","нормальное содержание холестерина","симптоматика раннего атеросклероза","\"молочная\" сыворотка"],"c":[3],"e":"Тип I — избыток хиломикронов (молочная сыворотка, панкреатиты, ксантомы), но атерогенность низкая: хиломикроны слишком крупные, чтобы проникать в стенку артерии.","t":"ibs"},{"id":"d7328a72","q":"Для пневмонии не характерно:","o":["притупление перкуторного звука","лихорадка","влажные звонкие хрипы","ослабление дыхания","сухие свистящие хрипы"],"c":[4],"e":"Свистящие хрипы — признак бронхообструкции. Для пневмонии типичны притупление, крепитация и звонкие влажные хрипы над очагом.","t":"pul"},{"id":"96d4b779","q":"К развитию хронического легочного сердца не приводит:","o":["ХОБЛ","силикоз","фиброзирующий альвеолит","ожирение","пневмония"],"c":[4],"e":"Пневмония — острый процесс, обычно разрешается и стойкой лёгочной гипертензии не даёт. Ожирение (синдром Пиквика) — к лёгочному сердцу приводит.","t":"pul"},{"id":"89bb781a","q":"К редким клиническим проявлениям синдрома приобретенного иммунодефицита относится:","o":["лихорадка","снижение массы тела","желудочно-кишечное кровотечение","хроническая диарея","лимфоаденопатия"],"c":[2],"e":"Лихорадка, похудание, диарея, лимфаденопатия — частые признаки ВИЧ-инфекции/СПИДа. ЖКК встречается редко.","t":"oth"},{"id":"968355b2","q":"К рекомендуемой антигипертензивной комбинации относится","o":["бета-адреноблокатор верапамил","диуретик иАПФ","антагонист кальция альфа-1-адреноблокатор"],"c":[1],"e":"иАПФ + диуретик — одна из основных рациональных комбинаций (ИАПФ ещё и уменьшает потерю калия). ББ + верапамил — опасная комбинация.","t":"ag"},{"id":"498efddf","q":"К симптомам тревоги при дифференциальной диагностике органических и функциональных кишечных расстройств относится:","o":["ночная диарея","рецидивирующие боли в животе","слизь в кале","длительное течение заболевания"],"c":[0],"e":"Функциональные расстройства (СРК) ночью не беспокоят. Ночные симптомы, кровь, похудание, лихорадка, анемия, начало после 50 лет — «красные флаги» органики.","t":"gas"},{"id":"e53eecc1","q":"К факторам риска колоректального рака относится:","o":["длительные запоры","синдром раздраженного кишечника","аденоматозный полип кишечника у близкого родственника","дивертикулез кишечника"],"c":[2],"e":"Семейный анамнез аденом/КРР — доказанный фактор риска. СРК и дивертикулёз риск рака не повышают.","t":"gas"},{"id":"9ac0ce2e","q":"К факторам риска рака желудка не относится:","o":["Мужской пол","Курение","Синдром Золлингера-Эллисона","Инфицированность пилорическим хеликобактером","Атрофический гастрит"],"c":[2],"e":"Золлингер-Эллисон (гастринома) даёт множественные язвы и гиперсекрецию, но не рак желудка. H. pylori и атрофия — главные факторы риска.","t":"gas"},{"id":"1524d781","q":"К факторам, способствующим возникновению хронического холецистита, не относится:","o":["инфекция","описторхоз","дискинезия желчных путей","аномалия развития","холелитиаз","рефлюкс желчи в желудок"],"c":[5],"e":"Дуоденогастральный рефлюкс — следствие, а не причина: поражает желудок (рефлюкс-гастрит), а не желчный пузырь.","t":"gas"},{"id":"b320d373","q":"К фактором агрессии, способствующим развитию язвенной болезни, не относится:","o":["избыточная секреция соляной кислоты и пепсина","избыточная секреция секретина","травматизация слизистой","пилорический хеликобактер","гастродуоденальная дисмоторика"],"c":[1],"e":"Секретин стимулирует выделение бикарбонатов поджелудочной железой и тормозит секрецию кислоты — это фактор ЗАЩИТЫ.","t":"gas"},{"id":"6d50eb02","q":"К фибринспецифичным тромболитическим препаратам относят следующие, кроме:","o":["альтеплаза","тенектеплаза","проурокиназа","стрептокиназа"],"c":[3],"e":"Стрептокиназа активирует плазминоген и в тромбе, и в крови (неселективна), к тому же антигенна. Альтеплаза, тенектеплаза, проурокиназа действуют прицельно на фибрин тромба.","t":"ibs"},{"id":"bb16052f","q":"Какие дозы йода в составе фармацевтических препаратов называются \"физиологическими\"?","o":["150 микрограммов","1000 микрограммов","75 миллиграммов"],"c":[0],"e":"Суточная потребность взрослого — 150 мкг (беременным 250 мкг). Миллиграммовые дозы — фармакологические (блокируют железу).","t":"end"},{"id":"28c55b73","q":"Какие медикаменты предпочтительнее при гиперхолестеринемии без гипертриглицеридемии","o":["статины","фибраты","пробукол","эндурацин","рыбий жир"],"c":[0],"e":"Статины — препараты выбора для снижения ЛПНП. Фибраты и омега-3 — при высоких триглицеридах.","t":"ibs"},{"id":"127a46c3","q":"Какие побочные явления могут быть при лечении статинами повышенной литогенности желчи:","o":["повышение КФК","миопатии","импотенция","гиперурикемия","повышение КФК и миопатии"],"c":[4],"e":"Главные побочные эффекты статинов — миопатия (вплоть до рабдомиолиза, с ростом КФК) и повышение трансаминаз.","t":"ibs"},{"id":"8ff48fa5","q":"Какие сердечные клапаны поражаются в первую очередь при инфекционном эндокардите:","o":["митральный","трикуспидальный","клапан легочной артерии","аортальный","аортальный, митральный"],"c":[4],"e":"Чаще всего поражаются клапаны левого сердца (аортальный и митральный — высокое давление и турбулентность). Трикуспидальный — у внутривенных наркоманов.","t":"ser"},{"id":"b1f85b83","q":"Какое лечение следует назначить пожилому больному с декомпенсированным гипотиреозом?","o":["направить в санаторий на бальнеологическое лечение","начать лечение L-тироксином с малых доз","начать лечение с больших доз L-тироксина под прикрытием ГК","назначить мочегонные","отказаться от лечения гипотиреоза"],"c":[1],"e":"У пожилых (риск ИБС) тироксин начинают с 12,5–25 мкг и повышают медленно: резкое ускорение обмена может спровоцировать стенокардию и ИМ.","t":"end"},{"id":"dadcf3b1","q":"Какой способ профилактики йодного дефицита наиболее эффективен?","o":["использование пищевых добавок и лекарственных препаратов","йодирование питьевой воды","йодирование основных продуктов питания (соль, хлеб)"],"c":[2],"e":"Массовая профилактика — йодирование основных продуктов, прежде всего соли. Препараты йода — индивидуальная/групповая профилактика.","t":"end"},{"id":"9d33f057","q":"Калийсберегающий эффект верошпирона проявляется через","o":["1-2 часа","1-3 дня","7-14 дней","15-21 день"],"c":[1],"e":"Спиронолактон действует медленно (через блокаду рецепторов альдостерона и синтез белков): эффект через 2–3 дня, максимум — к концу 1–2 недели.","t":"ser","d":"Ключ может отличаться (иногда указывают 7–14 дней как время максимального эффекта).","u":1},{"id":"cdd9dc7d","q":"Кальцификация ткани поджелудочной железы наиболее характерна для:","o":["билиогенного панкреатита","обструктивного панкреатита","алкогольного панкреатита"],"c":[2],"e":"Алкоголь повышает вязкость панкреатического сока и образование белковых пробок, которые обызвествляются → кальцифицирующий панкреатит.","t":"gas"},{"id":"13f81b01","q":"Классификация остеопороза основана на элементах","o":["этиологии","патогенеза","симптоматики","распространенности процесса","стадии развития заболевания"],"c":[0],"e":"Основное деление — по этиологии: первичный (постменопаузальный, сенильный, идиопатический) и вто
