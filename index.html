,"не влияет на тонус нижнего пищеводного сфинктера"],"c":[1],"e":"Никотин расслабляет НПС → заброс кислоты, курение — фактор риска ГЭРБ.","t":"gas"},{"id":"e8c9e5ca","q":"Латентный дефицит железа (ЛДЖ) подтверждается снижением уровня:","o":["Нв менее 120 г/л","железа сыворотки менее 11.5 ммоль/л","ферритина сыворотки менее 20.0 ммоль/л"],"c":[2],"e":"Латентный дефицит = истощены запасы (низкий ферритин) при ещё нормальном гемоглобине. Если Hb снижен — это уже анемия.","t":"hem"},{"id":"04b2944e","q":"Лечебные мероприятия при диабетической коме не включают:","o":["немедленную госпитализацию и интенсивную инсулинотерапию","устранение нарушений углеводного и липидного обменов","борьбу с дегидратацией","борьбу с сердечно-сосудистой недостаточностью","прежний режим введения инсулина"],"c":[4],"e":"При кетоацидотической коме переходят на внутривенный инсулин короткого действия малыми дозами; прежняя схема не годится.","t":"end"},{"id":"a27753ca","q":"Лечение бета-адреноблокаторами при артериальной гипертензии показано:","o":["больным пожилого возраста без сопутствующей ИБС","при сопутствующем сахарном диабете","при сопутствующей ИБС, независимо от возраста"],"c":[2],"e":"ББ снижают потребность миокарда в O₂ и улучшают прогноз после ИМ — особое показание при АГ + ИБС (а также СН, тахиаритмии).","t":"ag"},{"id":"36c84c25","q":"Лечение больных диабетом с инфарктом миокарда предусматривает:","o":["инсулинотерапию инсулинами короткого действия","отмену метформина, глибенкламида","инсулинотерапию, как единственную терапию для компенсации диабета 2 типа","ограничение назначения кардиоселективных b-блокаторов","отмену диабетона МВ и амарила"],"c":[0],"e":"В остром периоде ИМ гликемию контролируют инсулином короткого действия (гибко, без риска лактатацидоза/гипогликемии от таблеток). ББ, наоборот, нужны.","t":"end","d":"Отмена метформина тоже правильна по сути; в тестах ключ чаще — инсулин короткого действия.","u":1},{"id":"2ff4249f","q":"Лечение ЖДА средней тяжести лучше начать с препараты железа — первая линия (эффективны, безопасны). Инъекции — по особым показаниям.","t":"hem"},{"id":"0ca25d76","q":"Медленно наполняющийся малый пульс характерен для:","o":["митрального стеноза","аортальной недостаточности","аортального стеноза","митральной недостаточности"],"c":[2],"e":"Через суженное устье кровь выходит медленно и малым объёмом → малый медленный пульс. При аортальной недостаточности, наоборот, быстрый высокий (celer et altus).","t":"ser"},{"id":"e46b07e7","q":"Между активностью ренина и магистральным почечным кровотоком существует следующая взаимосвязь:","o":["активность ренина не изменяется при уменьшении почечного кровотока","активность ренина увеличивается при снижении почечного кровотока","активность ренина снижается при уменьшении почечного кровотока"],"c":[1],"e":"Юкстагломерулярный аппарат реагирует на снижение перфузии выбросом ренина — основа вазоренальной АГ.","t":"ag"},{"id":"e4697abb","q":"Метастаз Вирхова локализуется в области:","o":["печени","прямокишечно-пузырной складки","между ножками кивательной мышцы","в яичниках","в легких"],"c":[2],"e":"Вирховский метастаз — в левый надключичный лимфоузел (между ножками грудино-ключично-сосцевидной мышцы). Шницлера — в дугласово пространство, Крукенберга — в яичники.","t":"gas"},{"id":"be2d8be4","q":"Метопролол применяется при ишемической болезни сердца потому, что","o":["снижает потребность миокарда в кислороде","расширяет коронарные сосуды","вызывает спазм периферических сосудов","увеличивает потребность миокарда в кислороде","увеличивает сократительную способность миокарда"],"c":[0],"e":"ББ урежают пульс, снижают АД и сократимость → сердцу нужно меньше кислорода, удлиняется диастола (лучше коронарное наполнение).","t":"ibs"},{"id":"bbe4b311","q":"Механизм сахароснижающего действия препаратов сульфанилмочевины включает","o":["увеличение числа тканевых рецепторов инсулина","стимуляцию секреции инсулина b-клетками","подавление продукции глюкагона","уменьшение чувствительности к эндогенному инсулину","уменьшение абсорбции глюкозы в кишечнике"],"c":[1],"e":"ПСМ закрывают АТФ-зависимые K-каналы β-клеток → выброс инсулина. Отсюда главный риск — гипогликемия.","t":"end"},{"id":"f1fe65e5","q":"Митральный стеноз следует дифференцировать со всеми перечисленными заболеваниями, кроме:","o":["пролапса митрального клапана","дефекта межпредсердной перегородки","недостаточности аортального клапана","миксомы левого предсердия","коарктации аорты"],"c":[4],"e":"Коарктация даёт систолический шум и АГ на руках — на МС не похожа. Миксома ЛП имитирует МС, при аортальной недостаточности бывает шум Флинта (имитирует диастолический шум МС), ДМПП — тоже.","t":"ser"},{"id":"87f8e6a2","q":"Митральный стеноз чаще всего является следствием:","o":["ревматизма","инфекционного эндокардита","системной красной волчанки","атеросклероза"],"c":[0],"e":"Подавляющее большинство митральных стенозов — ревматические (сращение комиссур).","t":"ser"},{"id":"7019adf2","q":"Моксонидин (физиотенз) препарат:","o":["бета-адреноблокатор","центрального действия","ИАПФ","диуретик"],"c":[1],"e":"Моксонидин — агонист имидазолиновых I1-рецепторов продолговатого мозга, снижает симпатический тонус. Меньше седации, чем у клонидина.","t":"ag"},{"id":"a1b33f14","q":"Мужчина 31 года заболел остро. 5 дней назад появились ноющие боли в эпигастральной области и правом подреберье, тошнота, анорексия, отрыжка воздухом. Злоупотреблял алкоголем. При обследовании выявлено снижение массы тела, тремор рук, субиктеричность склер, телеангиэктазии. Печень увеличена на 3см. Край плотный. Вероятный диагноз:","o":["острый вирусный гепатит","калькулезный холецистит","острый алкогольный гепатит","медикаментозный гепатит","рак печени"],"c":[2],"e":"Алкогольный анамнез + стигмы (тремор, телеангиэктазии) + увеличенная плотная печень + желтушность = острый алкогольный гепатит.","t":"gas"},{"id":"9695c1a6","q":"Назначение ИГКС при ХОБЛ согласно рекомендациям GOLD необходимо начинать при ОФВ 1:","o":["> 80%","<80%","70-50%","<50%","50-30%","<30%"],"c":[3],"e":"По классической схеме GOLD ИГКС добавляли при тяжёлой ХОБЛ (ОФВ1 < 50%) с частыми обострениями.","t":"pul","d":"Современный GOLD ориентируется на обострения и эозинофилы крови, а не на ОФВ1.","u":1},{"id":"87283116","q":"Наиболее предпочтительной стратегией лечения при клинически значимом поражении ствола левой коронарной артерии является:","o":["чрескожное коронарное вмешательство","медикаментозное лечение","аортокоронарное шунтирование"],"c":[2],"e":"Стеноз ствола ЛКА — классическое показание к АКШ: операция улучшает выживаемость.","t":"ibs"},{"id":"38d5f300","q":"Наиболее сильным предиктором долгосрочной выживаемости при хронической ИБС является:","o":["частота ангинозных приступов","толерантность к физической нагрузке","выраженность стенозирования коронарных артерий","фракция выброса левого желудочка"],"c":[3],"e":"Систолическая функция ЛЖ (ФВ) — самый мощный прогностический фактор: чем ниже ФВ, тем выше смертность.","t":"ibs"},{"id":"e3ed4469","q":"Наиболее часто причиной острого бронхита являются:","o":["физические (сухой, горячий, холодный воздух) факторы","химические (кислоты, щелочи, окись азота, кремний и др.) факторы","инфекционные (вирусы, бактерии) факторы","аллергические (пыль, пыльца) агенты"],"c":[2],"e":"~90% острых бронхитов вызывают вирусы (грипп, РС-вирус, риновирусы), реже бактерии.","t":"pul"},{"id":"c78a15c3","q":"Наиболее частой причиной развития вторичной артериальной гипертензии является","o":["заболевания почек","заболевания эндокринной системы","врожденные пороки сердца","коллагенозы","прием медикаментов"],"c":[0],"e":"Почечные (паренхиматозные и реноваскулярные) АГ — самые частые среди вторичных.","t":"ag"},{"id":"08343dbf","q":"Наиболее частый путь заражения при пневмонии:","o":["бронхогенный","гематогенный","лимфогенный"],"c":[0],"e":"Возбудители попадают в альвеолы через дыхательные пути (аспирация секрета ротоглотки, вдыхание аэрозоля).","t":"pul"},{"id":"8d867e4e","q":"Наиболее эффективный препарат д function counts(list){var c={new:0,learn:0,done:0};(list||ids()).forEach(function(id){c[st(id)]++});return c}
function plural(n,a,b,c){var m=n%10,h=n%100;return n+" "+(m==1&&h!=11?a:m>=2&&m<=4&&(h<12||h>14)?b:c)}
function topicStats(t){var l=ids(function(d){return d.t==t}),c=counts(l),ok=0,n=0,w=0;l.forEach(function(id){var p=P(id);if(p){ok+=p.ok;n+=p.n;if(weak(id))w++}});return{l:l,c:c,acc:n?ok/n:null,w:w,total:l.length}}

function home(){
  var now=Date.now(),all=ids(),c=counts(all),due=all.filter(function(id){return isDue(id,now)}).length,w=all.filter(weak).length,
  u=all.filter(function(id){return Q[BY[id]].u}).length,fv=Object.keys(S.fav).length,s=streak(),tk=S.days[dk()]||{n:0,ok:0};
  var R=42,C=2*Math.PI*R,pd=c.done/all.length,pl=c.learn/all.length;

  '<div class="legend"><div><span class="dot" style="background:var(--ok)"></span>Выучено: <b>'+c.done+'</b></div><div><span class="dot" style="background:var(--warn)"></span>В процессе: <b>'+c.learn+'</b></div><div><span class="dot" style="background:var(--new)"></span>Новые: <b>'+c.new+'</b></div></div></div>'+

  '<button class="btn pri" id="go"><span class="ic">▶</span><span><b>'+(c.new==Q.length?'Начать обучение':'Продолжить обучение')+'</b><small>'+(due?'Повторить: '+due+' · ':'')+(c.new?'новых: '+c.new:'новых больше нет')+' · '+S.size+' за раз</small></span></button>'+
  '<button class="btn" id="mis" '+(w?'':'disabled')+'><span class="ic">🎯</span><span><b>Работа над ошибками</b><small>'+(w?'Вопросы, где вы ошибались, пока не будут отвечены верно 3 раза':'Ошибок пока нет')+'</small></span>'+(w?'<span class="bd">'+w+'</span>':'')+'</button>'+
  '<button class="btn" id="wk"><span class="ic">📉</span><span><b>Слабые темы</b><small>Точность по разделам, тренировка по теме</small></span></button>'+
  '<div class="grid2"><button class="btn" id="ex"><span class="ic">📝</span><span><b>Экзамен</b><small>Без подсказок, разбор в конце</small></span></button>'+
  '<button class="btn" id="br"><span class="ic">📚</span><span><b>Все вопросы</b><small>Поиск и ответы</small></span></button>'+
  '<button class="btn" id="fv" '+(fv?'':'disabled')+'><span class="ic">⭐</span><span><b>Избранное</b><small>'+(fv?plural(fv,"вопрос","вопроса","вопросов"):'Отмечайте трудные')+'</small></span></button>'+
  '<button class="btn" id="stt"><span class="ic">📊</span><span><b>Статистика</b><small>Прогресс и настройки</small></span></button></div>'+
  (backupOld&&canSave?'<div class="note">💾 Сохраните резервную копию прогресса: <button class="lnk" id="bk">Сохранить файл</button></div>':'')+
  '<div class="muted center" style="margin-top:14px">'+u+' вопросов с пометкой «ключ неуверенный»: официального ключа нет, ответ выбран по учебникам.</div>';
  $("go").onclick=function(){start(pickSmart(all),"learn","Обучение")};
  $("mis").onclick=function(){start(pickMistakes(),"learn","Работа над ошибками")};
  $("wk").onclick=topics;$("ex").onclick=examSetup;$("br").onclick=function(){browse()};$("stt").onclick=stats;
  $("fv").onclick=function(){start(shuffle(Object.keys(S.fav).filter(function(id){return id in BY})).slice(0,S.size),"learn","Избранное")};
  if($("bk"))$("bk").onclick=function(){exportData();home()};

function $(id){return document.getElementById(id)}
function byDue(a,b){return S.p[a].due-S.p[b].due}
function pickSmart(pool){
  var now=Date.now(),due=[],nw=[],rest=[],n=S.size;
  pool.forEach(function(id){var p=P(id);if(!p||!p.n)nw.push(id);else if(p.due<=now)due.push(id);else rest.push(id)});
  due.sort(function(a,b){return (S.p[a].lv-S.p[b].lv)||byDue(a,b)});
  var out=due.slice(0,Math.ceil(n*.6));
  out=out.concat(nw.slice(0,n-out.length));
  if(out.length<n)out=out.concat(due.slice(out.length,out.length+(n-out.length)));
  if(out.length<n){rest.sort(function(a,b){return (S.p[a].lv-S.p[b].lv)||byDue(a,b)});out=out.concat(rest.slice(0,n-out.length))}
  return shuffle(out.slice(0,n));
}
function pickMistakes(pool){
  var l=(pool||ids()).filter(weak);
  l.sort(function(a,b){var x=S.p[a],y=S.p[b];return (y.wr/y.n-x.wr/x.n)||(x.lv-y.lv)});
  return shuffle(l.slice(0,S.size));
}

/* ---------- тренировка ---------- */
var ss;
function start(list,mode,title){if(!list.length)return;ss={q:list.slice(),i:0,mode:mode,title:title,total:list.length,done:0,ok:0,combo:0,maxc:0,seen:{},wrong:[],ans:[]};show()}
function keepOrder(o){return o.some(function(t){return /перечисл|ни те|как .*, так|^все |оба /i.test(t)})||o.every(function(t){return /^[<>≥≤\d\s"]|^стеноз >/.test(t)})||o.some(function(t,i){return o.some(function(u,j){return j!=i&&u.length>8&&t.indexOf(u)==0&&t.length>u.length+5})})}
function show(){
  if(ss.i>=ss.q.length)return finish();
  var id=ss.q[ss.i],d=Q[BY[id]],multi=d.c.length>1,rep=ss.seen[id];
  var opts=d.o.map(function(t,k){return{t:t,k:k}});if(!keepOrder(d.o))shuffle(opts);
  ss.cur={id:id,d:d,opts:opts,sel:[],multi:multi,answered:false};
  var p=P(id),tags='<span class="tag">'+TOP[d.t]+'</span>'+(rep?'<span class="tag b">повтор ошибки</span>':(!p||!p.n?'<span class="tag">новый</span>':''))+(d.u?'<span class="tag w">ключ неуверенный</span>':'');
  app.innerHTML='<div class="top"><button class="x" id="quit">✕</button><div class="prog"><i style="width:'+(ss.done/ss.total*100)+'%"></i></div><div class="cnt">'+Math.min(ss.done+1,ss.total)+' / '+ss.total+'</div></div>'+
  '<div class="combo">'+(ss.combo>=3?'🔥 '+ss.combo+' подряд':'')+'</div>'+
  '<div class="card"><div class="tags">'+tags+'</div><p class="q">'+esc(d.q)+'</p><div class="hint">'+(multi?'Несколько верных ответов: отметьте все и нажмите «Ответить»':(ss.mode=="exam"?'Экзамен: разбор будет в конце':'Выберите один ответ'))+'</div>'+
  '<div id="opts">'+opts.map(function(o,j){return'<button class="opt" data-j="'+j+'"><span class="k">'+L[j]+'</span><span>'+esc(o.t)+'</span></button>'}).join('')+'</div><div id="after"></div></div>'+
  '<div class="foot" id="foot"></div>';
  $("quit").onclick=function(){if(ss.done===0)return home();if(confirm("Закончить занятие? Ответы уже сохранены."))finish()};
  $("opts").onclick=function(e){var b=e.target.closest(".opt");if(!b||ss.cur.answered)return;var j=+b.dataset.j;
    if(multi){var s=ss.cur.sel,ix=s.indexOf(j);if(ix<0)s.push(j);else s.splice(ix,1);b.classList.toggle("sel");
      $("foot").innerHTML=s.length?'<button class="big" id="ans">Ответить</button>':'';if(s.length)$("ans").onclick=answer}
    else{ss.cur.sel=[j];answer()}};
  window.scrollTo(0,0);
}
function record(id,good){
  var p=S.p[id]||(S.p[id]={lv:0,due:0,n:0,ok:0,wr:0,last:0}),now=Date.now();
  p.n++;p.last=now;
  if(good){p.ok++;p.lv=Math.min(p.lv+1,INT.length-1);p.due=now+INT[p.lv]}
  else{p.wr++;p.lv=0;p.due=now+10*60e3}
  var k=dk();S.days[k]=S.days[k]||{n:0,ok:0};S.days[k].n++;if(good)S.days[k].ok++;
  save();
}
function answer(){
  var c=ss.cur;if(c.answered)return;c.answered=true;
  var right=c.opts.map(function(o,j){return c.d.c.indexOf(o.k)>=0?j:-1}).filter(function(j){return j>=0});
  var good=right.length==c.sel.length&&right.every(function(j){return c.sel.indexOf(j)>=0});
  var first=!ss.seen[c.id];
  if(first){record(c.id,good);ss.ans.push({id:c.id,good:good,sel:c.sel.map(function(j){return c.opts[j].k})});if(good)ss.ok++;else ss.wrong.push(c.id)}
  ss.seen[c.id]=(ss.seen[c.id]||0)+1;
  ss.done=Math.min(ss.done+(first?1:0),ss.total);
  if(good){ss.combo++;ss.maxc=Math.max(ss.maxc,ss.combo)}else{ss.combo=0;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
  if(ss.mode=="exam"){ss.i++;return show()}
  // ошибка возвращается через несколько вопросов, пока не будет отвечена верно
  if(!good&&ss.seen[c.id]<4){var pos=Math.min(ss.q.length,ss.i+4);ss.q.splice(pos,0,c.id)}
  var bs=document.querySelectorAll(".opt");
  bs.forEach(function(b,j){var isR=right.indexOf(j)>=0,isS=c.sel.indexOf(j)>=0;b.classList.remove("sel");
    if(isR)b.classList.add("ok");else if(isS)b.classList.add("bad");else b.classList.add("dim")});
  var d=c.d,rt=d.c.map(function(k){return d.o[k]}).join("; ");
  $("after").innerHTML='<div class="fb '+(good?'ok':'bad')+'"><h4>'+(good?'✓ Верно':'✗ Неверно. Правильно: '+esc(rt))+'</h4>'+esc(d.e||'')+
  (d.d?'<div class="nt">⚠️ '+esc(d.d)+'</div>':'')+(!good?'<div class="muted" style="margin-top:6px">Вопрос вернётся в этом занятии и в работе над ошибками.</div>':'')+'</div>';
  $("foot").innerHTML='<button class="big" id="nx">Дальше</button><div class="tools"><button id="fav" class="'+(S.fav[c.id]?'on':'')+'">'+(S.fav[c.id]?'★ В избранном':'☆ В избранное')+'</button></div>';
  $("nx").onclick=function(){ss.i++;show()};
  $("fav").onclick=function(){if(S.fav[c.id])delete S.fav[c.id];else S.fav[c.id]=1;save();this.className=S.fav[c.id]?'on':'';this.textContent=S.fav[c.id]?'★ В избранном':'☆ В избранное'};
  setTimeout(function(){$("after").scrollIntoView({behavior:"smooth",block:"nearest"})},50);
}
function finish(){
  var n=ss.ans.length,ok=ss.ok,pc=n?Math.round(ok/n*100):0;
  if(ss.mode=="exam"&&n){S.exams.push({t:Date.now(),n:n,ok:ok,ms:Date.now()-ss.t0});save()}
  var h='<h1>'+esc(ss.title)+'</h1><div class="card res"><div class="n" style="color:'+(pc>=70?'var(--ok)':pc>=50?'var(--warn)':'var(--bad)')+'">'+pc+'%</div><div class="sub">'+ok+' из '+n+' верно с первой попытки'+(ss.maxc>=3?' · серия '+ss.maxc:'')+'</div>'+
  (ss.mode=="exam"?'<div class="sub">'+(pc>=70?'Экзамен сдан (порог 70%)':'Порог 70% пока не достигнут')+'</div>':'')+'</div>';
  if(ss.wrong.length){
    h+='<div class="card"><h2>Ошибки ('+ss.wrong.length+')</h2>'+ss.ans.filter(function(a){return!a.good}).map(function(a){var d=Q[BY[a.id]];
      return'<div class="li"><div class="lq">'+esc(d.q)+'</div><div class="la">'+(a.sel.length?'<div style="color:var(--bad)">Ваш ответ: '+esc(a.sel.map(function(k){return d.o[k]}).join("; "))+'</div>':'')+
      '<div class="r">Правильно: '+esc(d.c.map(function(k){return d.o[k]}).join("; "))+'</div><div class="ex">'+esc(d.e||'')+'</div>'+(d.d?'<div class="nt">⚠️ '+esc(d.d)+'</div>':'')+'</div></div>'}).join('')+'</div>';
  }
  h+='<div class="row">'+(ss.wrong.length?'<button class="big" id="rw">Повторить ошибки</button>':'')+'<button class="big '+(ss.wrong.length?'sec':'')+'" id="more">Ещё занятие</button></div>'+
  '<button class="big sec" style="margin-top:10px" id="hm">На главную</button>';
  app.innerHTML=h;window.scrollTo(0,0);
  var wr=ss.wrong.slice(),m=ss.mode,t=ss.title;
  if($("rw"))$("rw").onclick=function(){start(shuffle(wr),"learn","Повтор ошибок")};
  $("more").onclick=function(){m=="exam"?examSetup():start(t=="Работа над ошибками"?pickMistakes():pickSmart(ids()),"learn",t=="Работа над ошибками"?t:"Обучение")};
  $("hm").onclick=home;
}

/* ---------- темы ---------- */
function topics(){
  var rows=Object.keys(TOP).map(function(t){return{t:t,s:topicStats(t)}});
  rows.sort(function(a,b){var x=a.s.acc==null?2:a.s.acc,y=b.s.acc==null?2:b.s.acc;return x-y});
  app.innerHTML='<div class="top"><button class="x" id="bk">← Назад</button></div><h1>Слабые темы</h1><div class="sub">Сверху темы с самой низкой точностью. Нажмите на тему, чтобы тренировать только её.</div>'+
  '<div class="card">'+rows.map(function(r){var s=r.s,T=s.total;return'<button class="tp" data-t="'+r.t+'"><div class="nm"><b>'+TOP[r.t]+'</b><small>'+T+' вопр. · выучено '+s.c.done+(s.w?' · ошибок: '+s.w:'')+'</small>'+
    '<div class="bar"><i style="width:'+(s.c.done/T*100)+'%;background:var(--ok)"></i><i style="width:'+(s.c.learn/T*100)+'%;background:var(--warn)"></i></div></div>'+
    '<div class="pc" style="color:'+(s.acc==null?'var(--mut)':s.acc>=.8?'var(--ok)':s.acc>=.6?'var(--warn)':'var(--bad)')+'">'+(s.acc==null?'—':Math.round(s.acc*100)+'%')+'</div></button>'}).join('')+'</div>'+
  '<div class="muted">Процент: доля верных ответов по теме за всё время.</div>';
  $("bk").onclick=home;
  app.querySelectorAll(".tp").forEach(function(b){b.onclick=function(){topicMenu(b.dataset.t)}});
}
function topicMenu(t){
  var s=topicStats(t),w=s.l.filter(weak);
  app.innerHTML='<div class="top"><button class="x" id="bk">← Темы</button></div><h1>'+TOP[t]+'</h1><div class="sub">'+s.total+' вопросов · выучено '+s.c.done+' · в процессе '+s.c.learn+' · новых '+s.c.new+'</div><div style="height:12px"></div>'+
  '<button class="btn pri" id="a"><span class="ic">▶</span><span><b>Учить тему</b><small>Повторения и новые вопросы этой темы</small></span></button>'+
  '<button class="btn" id="b" '+(w.length?'':'disabled')+'><span class="ic">🎯</span><span><b>Ошибки в теме</b><small>'+(w.length?plural(w.length,"вопрос","вопроса","вопросов"):'Ошибок нет')+'</small></span></button>'+
  '<button class="btn" id="c"><span class="ic">📚</span><span><b>Посмотреть все вопросы темы</b><small>С ответами и пояснениями</small></span></button>';
  $("bk").onclick=topics;
  $("a").onclick=function(){start(pickSmart(s.l),"learn",TOP[t])};
  $("b").onclick=function(){start(pickMistakes(s.l),"learn","Ошибки: "+TOP[t])};
  $("c").onclick=function(){browse({t:t})};
}

/* ---------- все вопросы ---------- */
var bf={f:"all",t:"",s:""};
function browse(o){
  if(o){bf={f:"all",t:o.t||"",s:""}}
  var F=[["all","Все"],["weak","Ошибки"],["u","Ключ неуверенный"],["fav","Избранное"],["new","Не изучены"],["done","Выучены"]];
  app.innerHTML='<div class="top"><button class="x" id="bk">← Назад</button></div><h1>Все вопросы</h1>'+
  '<input type="search" id="s" placeholder="Поиск по тексту вопроса или ответа" value="'+esc(bf.s)+'">'+
  '<div class="chips" id="f">'+F.map(function(x){return'<button data-f="'+x[0]+'" class="'+(bf.f==x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>'+
  '<div class="chips" id="tt"><button data-t="" class="'+(bf.t?'':'on')+'">Все темы</button>'+Object.keys(TOP).map(function(t){return'<button data-t="'+t+'" class="'+(bf.t==t?'on':'')+'">'+TOP[t]+'</button>'}).join('')+'</div>'+
  '<div class="muted" id="cn"></div><div class="card" id="lst"></div>';
  $("bk").onclick=home;
  $("s").oninput=function(){bf.s=this.value;render()};
  $("f").onclick=function(e){var f=e.target.dataset.f;if(f!=null){bf.f=f;browse()}};
  $("tt").onclick=function(e){var t=e.target.dataset.t;if(t!=null){bf.t=t;browse()}};
  render();
  function render(){
    var s=bf.s.trim().toLowerCase();
    var l=Q.filter(function(d){if(bf.t&&d.t!=bf.t)return false;var f=bf.f;
      if(f=="weak"&&!weak(d.id))return false;if(f=="u"&&!d.u)return false;if(f=="fav"&&!S.fav[d.id])return false;if(f=="new"&&st(d.id)!="new")return false;if(f=="done"&&st(d.id)!="done")return false;
      if(s&&(d.q+" "+d.o.join(" ")).toLowerCase().indexOf(s)<0)return false;return true});
    $("cn").textContent="Найдено: "+l.length+". Нажмите на вопрос, чтобы увидеть ответ.";
    $("lst").innerHTML=l.length?l.slice(0,400).map(function(d){var p=P(d.id);return'<div class="li" data-id="'+d.id+'"><div class="lq">'+(S.fav[d.id]?'⭐ ':'')+esc(d.q)+'</div><div class="la" hidden>'+
      d.o.map(function(t,k){return'<div'+(d.c.indexOf(k)>=0?' class="r">✓ ':' class="muted">· ')+esc(t)+'</div>'}).join('')+'<div class="ex">'+esc(d.e||'')+'</div>'+(d.d?'<div class="nt">⚠️ '+esc(d.d)+'</div>':'')+
      '<div class="muted" style="margin-top:4px">'+TOP[d.t]+(p&&p.n?' · ответов: '+p.n+', верно: '+p.ok:' · ещё не отвечали')+'</div></div></div>'}).join(''):'<div class="muted">Ничего не найдено</div>';
  }
  $("lst").onclick=function(e){var li=e.target.closest(".li");if(!li||!e.target.closest(".lq"))return;var a=li.querySelector(".la");a.hidden=!a.hidden};
}

/* ---------- статистика и настройки ---------- */
function stats(){
  var all=ids(),tot=0,ok=0;all.forEach(function(id){var p=P(id);if(p){tot+=p.n;ok+=p.ok}});
  var days=[],mx=1;for(var i=13;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var v=S.days[dk(d)]||{n:0,ok:0};days.push({d:d,v:v});mx=Math.max(mx,v.n)}
  var active=Object.keys(S.days).length,ex=S.exams,best=ex.reduce(function(m,e){return Math.max(m,e.ok/e.n)},0);
  app.innerHTML='<div class="top"><button class="x" id="bk">← Назад</button></div><h1>Статистика</h1>'+
  '<div class="card"><div class="kv"><div><b>'+tot+'</b><span>ответов</span></div><div><b>'+(tot?Math.round(ok/tot*100)+'%':'—')+'</b><span>точность</span></div><div><b>'+active+'</b><span>дней занятий</span></div></div></div>'+
  '<div class="card"><h2>Последние 14 дней</h2><div class="chart">'+days.map(function(x){return'<div><i class="'+(x.v.n?'':'e')+'" style="height:'+(x.v.n/mx*100)+'%" title="'+x.v.n+'"></i><span>'+x.d.getDate()+'</span></div>'}).join('')+'</div><div class="muted" style="margin-top:6px">Ответов в день. Лучше понемногу каждый день, чем много за один раз.</div></div>'+
  '<div class="card"><h2>Экзамены</h2>'+(ex.length?'<div class="sub">Сдано: '+ex.length+' · лучший результат: '+Math.round(best*100)+'%</div>':'<div class="muted">Пока не было</div>')+'</div>'+
  '<div class="card"><h2>Настройки</h2><div class="set"><span>Вопросов за занятие</span></div><div class="seg" id="sz">'+[10,20,30,50].map(function(n){return'<button data-n="'+n+'" class="'+(S.size==n?'on':'')+'">'+n+'</button>'}).join('')+'</div>'+
  '<div class="set" style="margin-top:8px"><div><b>Резервная копия</b><div class="muted">'+(S.lastBackup?'Последняя: '+new Date(S.lastBackup).toLocaleDateString("ru-RU"):'Ещё не сохраняли')+'</div></div></div>'+
  '<div class="row"><button class="big" id="exp">Сохранить</button><button class="big sec" id="im">Загрузить</button></div>'+
  '<div class="muted" style="margin-top:8px">Прогресс хранится в браузере на телефоне. Файл копии пригодится, если очистить данные Chrome или сменить телефон.</div>'+
  '<div class="set"><span>Сбросить весь прогресс</span><button class="lnk" style="color:var(--bad)" id="rst">Сбросить</button></div></div>'+
  '<div class="card"><h2>Как устроено обучение</h2><div class="muted">Каждый вопрос проходит интервальные повторения: после верного ответа он возвращается через 1, 3, 7, 16, 35 дней. Вопрос считается выученным после 3 верных ответов подряд в разные дни. Ошибка сбрасывает вопрос в начало, и он появится снова в этом же занятии и в «Работе над ошибками».</div></div>';
  $("bk").onclick=home;
  $("sz").onclick=function(e){var n=e.target.dataset.n;if(n){S.size=+n;save();stats()}};
  $("exp").onclick=function(){exportData();stats()};
  $("im").onclick=function(){$("imp").click()};
  $("rst").onclick=function(){if(confirm("Удалить весь прогресс? Это нельзя отменить.")&&confirm("Точно удалить?")){S.p={};S.days={};S.exams=[];S.fav={};save();home()}};
}
function exportData(){
  S.lastBackup=Date.now();save();
  var b=new Blob([JSON.stringify({app:"ther_trainer",v:2,saved:new Date().toISOString(),S:S})],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="терапия-прогресс-"+dk()+".json";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
$("imp").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.S||!o.S.p)throw 0;
  if(confirm("Заменить текущий прогресс данными из файла?")){S=Object.assign(S,o.S);save();alert("Прогресс загружен");home()}}catch(e){alert("Не удалось прочитать файл копии")}};r.readAsText(f);this.value=""};

if("serviceWorker" in navigator&&location.protocol=="https:")navigator.serviceWorker.register("sw.js").catch(function(){});
home();
</script>
</body>
